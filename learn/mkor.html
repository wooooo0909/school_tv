<html lang="ko"><head><meta charset="utf-8">

<title>사라진 글자</title>

<style>
:root{color-scheme:dark;--bg:#040609;--panel:#0b0e14;--edge:#283040;--fg:#d8dacd;--dim:#868e9b;--chalk:#eef0e2;--amber:#cfa95f;--red:#d0604e;--green:#86b592;--whisper:#9db0c8;--btn:#131922;--btn2:#1b212c;--glass:rgba(6,8,12,.88);
--serif:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif;--sans:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{margin:0 auto;padding-block:8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tv body{overflow:hidden;margin:0}
.tv .wrap{padding:0}
.screen{position:relative;margin:0 auto;background:#000;overflow:hidden;border:1px solid var(--edge)}

canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}

.hud b{color:var(--fg);font-family:var(--serif);font-weight:700;letter-spacing:.04em;margin-right:.6em}

.lead i{width:.7em;height:1em;background:var(--amber);margin-left:.35em;border-radius:50% 50% 50% 50%/68% 68% 32% 32%;box-shadow:0 0 .5em rgba(207,169,95,.8);transition:background-color .4s,box-shadow .4s}

@keyframes lw{to{opacity:.45}}
.hb{background:none;border:1px solid var(--edge);color:var(--dim);font:inherit;font-size:12px;padding:3px 8px;margin-left:8px;cursor:pointer;border-radius:2px;pointer-events:auto}
.hb:hover{color:var(--amber);border-color:var(--amber)}
.tv .hb{display:none}
.panel{min-height:150px;background:var(--panel);border-top:1px solid var(--edge);padding:12px 14px;font-family:var(--serif);font-size:16px;line-height:1.7}
.say{cursor:pointer;position:relative;min-height:118px}
.say p{margin:0;white-space:pre-wrap;word-break:keep-all}
.say.ch p{font-family:'Nanum Pen Script',var(--serif);font-size:1.8em;line-height:1.3;color:var(--chalk);letter-spacing:.06em;word-break:break-all;animation:ink 1.2s}
@keyframes ink{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
.say.wh p{color:var(--whisper);letter-spacing:.14em;animation:wv 2.4s infinite}
@keyframes wv{50%{opacity:.55}}
.say.ok{border-left:3px solid var(--green);padding-left:12px}
.say.ok p b{color:var(--chalk)}
.nx{position:absolute;right:.2em;bottom:0;color:var(--amber);font-size:.75em;animation:bl 1s steps(2) infinite}

.idle b{color:var(--amber);font-weight:400}
.qz{animation:qin .35s}

.qd u i{display:block;height:100%;background:var(--amber);transition:width .5s linear,background-color .3s}
.qd.near{color:var(--red)}
.qd.near u i{background:var(--red)}
.qd.near{animation:bl .5s steps(2) infinite}
.qq{margin:0 0 10px;word-break:keep-all}
.qq em{font-style:normal;color:var(--chalk);font-weight:700}
.hj{font-size:1.25em;letter-spacing:.12em;color:var(--chalk)}
.qo{display:flex;flex-wrap:wrap;margin:-4px}
.qb{flex:1 1 100%;margin:4px;min-width:0;text-align:left;background:var(--btn);color:var(--fg);border:1px solid var(--edge);padding:.6em .75em;font:inherit;font-size:.95em;line-height:1.4;border-radius:2px;cursor:pointer;word-break:keep-all;animation:qin .4s backwards}
.qb:nth-child(2){animation-delay:.07s}.qb:nth-child(3){animation-delay:.14s}.qb:nth-child(4){animation-delay:.21s}.qb:nth-child(5){animation-delay:.28s}
.qb i{font-style:normal;color:var(--dim);margin-right:.6em;font-family:var(--sans);font-size:.8em}
.qb.sel{border-color:var(--amber);background:var(--btn2);box-shadow:0 0 .8em rgba(207,169,95,.25)}
.qb.dead{opacity:.32;text-decoration:line-through;cursor:default}
.qb.done{border-color:var(--green);color:var(--green)}
.qm{margin:8px 0 0;color:var(--red);font-size:.82em;min-height:1.5em;font-family:var(--sans)}
.dial{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;margin:2px 0}
.dg{width:3em;margin:0 .3em;text-align:center}
.dg button{display:block;width:100%;background:none;border:0;color:var(--dim);font-size:.9em;padding:3px;cursor:pointer}
.dg b{display:block;font:700 1.9em/1.35 var(--serif);border:1px solid var(--edge);background:var(--btn);color:var(--fg)}
.dg.sel b{border-color:var(--amber);color:var(--amber)}
.dok{margin:.6em 0 0 .8em;background:var(--btn);border:1px solid var(--amber);color:var(--amber);font:inherit;font-size:.9em;padding:.6em .9em;cursor:pointer}
.os{width:1.2em;height:1.2em;vertical-align:-.22em;fill:currentColor}
.os text{font-family:var(--sans);font-weight:700}
.big{font-size:1.5em;color:var(--chalk);margin:0 .15em}
.big .os{width:1.45em;height:1.45em;vertical-align:-.3em}
.ov{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(4,6,9,.93);overflow-y:auto;padding:16px;text-align:center;z-index:6;font-size:16px}
.cine .ov.k-menu,.cine .ov.k-login{background:linear-gradient(rgba(4,6,9,.5),rgba(4,6,9,.86))}
.ov.k-end{animation:ein 1.6s}
@keyframes ein{from{background:rgba(0,0,0,1)}}
.ov h1{font:700 2.3em/1.15 var(--serif);letter-spacing:.2em;margin:.4em 0 .05em;padding-left:.2em;color:var(--chalk);text-shadow:0 0 .6em rgba(238,240,226,.25);animation:tfl 7s infinite}
@keyframes tfl{0%,91%,100%{opacity:1}92%{opacity:.35}93%{opacity:1}95%{opacity:.15}96%{opacity:.9}}
.ov h2{font:700 1.5em/1.3 var(--serif);color:var(--chalk);margin:.5em 0 .6em;letter-spacing:.06em}
.ov h3{font:700 .95em/1.4 var(--serif);color:var(--amber);margin:1.2em 0 .4em;letter-spacing:.06em}
.lost{margin:0 0 .2em;font-size:1.4em;color:var(--amber);letter-spacing:.9em;padding-left:.9em}
.lost span{animation:fl 5s infinite}
.lost span:nth-child(2){animation-delay:1.3s}.lost span:nth-child(3){animation-delay:2.9s}.lost span:nth-child(4){animation-delay:.6s}
@keyframes fl{0%,62%,100%{opacity:1}66%{opacity:.08}70%{opacity:.8}74%{opacity:.05}82%{opacity:1}}
.sub,.who,.fine{color:var(--dim);font-size:.8em;margin:.3em 0 .9em;word-break:keep-all}
.fine{margin-top:1em;font-size:.75em}
.mi{display:block;width:100%;max-width:19em;margin:.3em auto;padding:.5em .75em;background:transparent;border:1px solid transparent;color:var(--fg);font:400 1.05em/1.4 var(--serif);cursor:pointer;border-radius:2px}
.mi small{display:block;font-size:.68em;color:var(--dim);font-family:var(--sans)}
.mi.sel{border-color:var(--amber);color:var(--amber);background:rgba(207,169,95,.07)}
.mi[disabled]{opacity:.3;cursor:default}
.lg{font:700 1.9em/1.2 var(--serif);letter-spacing:.14em;margin:.2em 0 .25em;color:var(--chalk)}
.lg span{color:var(--amber)}
.kp{display:flex;flex-wrap:wrap;justify-content:center;width:14.6em;margin:0 auto .25em}
.mi.kb{display:inline-block;width:3.7em;margin:.25em;padding:.4em 0;border-color:var(--edge);font-family:var(--sans);font-size:1.1em}
.kp{font-size:1em}
.mi.kb.sel{border-color:var(--amber)}
.lmsg{color:var(--red);font-size:.8em;min-height:1.5em;margin:0}
.list{text-align:left;max-width:44em;margin:0 auto;font-size:.9em;line-height:1.65}
.list p{margin:0 0 .5em;padding-left:1em;text-indent:-1em;word-break:keep-all}
.list p.no{color:#4c5462}
.list b{color:var(--chalk)}
.endk{color:var(--amber);font-size:.75em;letter-spacing:.3em;margin:8% 0 0}
.endt{max-width:34em;margin:0 auto 1em;font:400 1.05em/1.9 var(--serif)}
.endt p{margin:0;opacity:0;animation:up .9s forwards;word-break:keep-all}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{position:absolute;left:0;right:0;top:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;pointer-events:none;transition:opacity .9s;text-align:center;padding:16px;font-size:16px}
.card b{font:700 1.7em/1.3 var(--serif);color:var(--chalk);letter-spacing:.14em;animation:ink 1.4s}
.card span{color:var(--amber);font-size:.8em;letter-spacing:.3em;margin-top:.6em;animation:ink 2s}
.card.out{opacity:0}
.pad{display:none;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--panel);border-top:1px solid var(--edge);-webkit-user-select:none;user-select:none;touch-action:none}
.touch .pad{display:flex}
.dp{position:relative;width:138px;height:138px;flex:none}
.dp button,.ab{position:absolute;width:46px;height:46px;background:var(--btn);border:1px solid var(--edge);color:var(--dim);font-size:18px;border-radius:6px;touch-action:none;pointer-events:auto}
.dp button:active,.ab:active{border-color:var(--amber);color:var(--amber)}
.ab{position:static;width:86px;height:86px;border-radius:50%;font:400 17px var(--serif);color:var(--fg)}
/* ── 넓은 화면·TV: 화면 전체가 무대, 글은 그 위에 겹쳐 뜬다 (글자 크기는 화면 폭에 비례) ── */
.cine .screen canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.cine .hud{position:absolute;left:0;right:0;top:0;z-index:2;font-size:.7em;padding:1.1em 1.6em 2.2em;min-height:0;background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,0));pointer-events:none}
.cine .hud b{font-size:1.25em}
.cine .hb{font-size:.8em}
.cine .panel{position:absolute;z-index:3;min-height:0;border:0;background:none;padding:0;font-size:1em;line-height:1.65}
.cine .panel.p-say{left:13%;right:13%;bottom:5.5%}
.cine .say{background:var(--glass);border:1px solid var(--edge);padding:1em 1.4em 1.2em;min-height:5.4em;box-shadow:0 0 2.5em rgba(0,0,0,.85);animation:qin .3s}
.cine .say.ch{background:rgba(4,5,8,.7);text-align:center;border-color:transparent}
.cine .say.ch p{font-size:2.3em}
.cine .say.ok{border-left:.25em solid var(--green)}
.cine .nx{right:1em;bottom:.6em}
.cine .panel.p-quiz{top:12%;width:42%}
.cine .panel.p-quiz.rt{right:2.2%}
.cine .panel.p-quiz.lf{left:2.2%}
.cine .qz{background:var(--glass);border:1px solid var(--edge);padding:1em 1.1em 1.1em;box-shadow:0 0 2.5em rgba(0,0,0,.85)}
.cine .qd{font-size:.6em;margin-bottom:.9em}
.cine .qd u{height:.4em;margin-top:.4em}
.cine .qq{font-size:.86em;margin-bottom:.8em}
.cine .qb{font-size:.8em;margin:.3em 4px}
.cine .qm{font-size:.66em;margin-top:.7em}
.cine .panel.p-idle{left:0;right:0;bottom:4.5%;text-align:center;pointer-events:none}
.cine .idle{display:inline-block;background:rgba(6,8,12,.66);padding:.4em 1.2em;border-radius:2em;font-size:.68em;animation:qin .3s}
.cine .ov,.cine .card{font-size:1em}
.cine .ov{padding:1.4em}
.cine .ov h1{font-size:3.5em;margin-top:.25em}
.cine.touch .pad{position:absolute;left:0;right:0;bottom:0;z-index:4;background:none;border:0;pointer-events:none;opacity:.75}
.cine.touch .panel.p-say{left:24%;right:22%}
@media(max-width:560px){.ov h1{margin-top:0}}
@media(prefers-reduced-motion:reduce){.lost span,.nx,.ov h1,.say.wh p{animation:none}}
</style>

A5:{t:'c',q:"벽에 붙은 연표. 한 줄이 비어 있다. <em>중세 국어는 언제부터 언제까지인가?</em>",o:["10세기 ~ 16세기","삼국 시대 ~ 10세기","17세기 ~ 19세기","15세기 ~ 19세기"],w:"중세 국어는 <b>10세기(고려 건국)부터 16세기(임진왜란)</b>까지다."},
A6:{t:'c',q:"진열장 안에 책 한 권. 표지에 『훈민정음』. <em>이 책(해례본)에 대한 설명으로 알맞은 것은?</em>",o:["1446년에 나왔고, 집현전 학자들이 풀이에 참여했다","1443년에 세종이 혼자 쓴 책이다","고려 시대에 향가를 모아 엮은 책이다","갑오개혁 때 펴낸 책이다"],w:"문자는 1443년에 세종이 만들었고, <b>책 『훈민정음』(해례본)은 1446년</b>에 집현전 학자들과 함께 펴냈다."},
A7:{t:'c',q:"유리 아래 누런 신문 스크랩. <em>'한글'이라는 이름을 지어 쓴 사람으로 알려진 이는?</em>",o:["주시경","세종","집현전 학자들","향가를 지은 사람들"],w:"'한글'이라는 이름은 <b>1910년대에 주시경</b>이 지어 쓴 것으로 알려져 있다."},
A8:{t:'c',q:"그 아래 달력 한 장. <em>1926년, 훈민정음 반포를 기념해 처음 정한 날의 이름은?</em>",o:["가갸날","한글날","훈민정음날","세종날"],w:"1926년에 <b>'가갸날'</b>이라는 이름으로 처음 기념했고, 이 이름이 뒤에 <b>'한글날'</b>로 바뀌었다."},
B1:{t:'c',q:"안내 패널: <em>우리 글자가 없던 때, 한자의 음과 훈을 빌려 우리말을 적던 방식은?</em>",o:["차자 표기","이어적기","가획","종성부용초성"],w:"<b>차자 표기</b>: 한자의 음(소리)이나 훈(뜻)을 빌려 우리말을 적는 방식."},
B2:{t:'c',q:"책등에 <span class='hj'>天</span> — 하늘(훈) 천(음). <em>뜻은 버리고 '천'이라는 소리만 빌려 적었다면?</em>",o:["음차","훈차","가획","상형"],w:"한자의 <b>소리(음)</b>를 빌리면 <b>음차</b>."},
B3:{t:'c',q:"<em>반대로 '하늘'이라는 우리말을 적으려고 <span class='hj'>天</span>의 뜻을 빌렸다면?</em>",o:["훈차","음차","이체","합용"],w:"한자의 <b>뜻(훈)</b>을 빌리면 <b>훈차</b>."},
B4:{t:'c',q:"얇은 책 한 권이 혼자 삐져나와 있다. <em>향가를 적는 데 쓰인, 차자 표기 가운데 가장 체계적인 표기는?</em>",o:["향찰","훈민정음","끊어적기","8종성법"],w:"<b>향찰</b>은 향가를 표기한 문자로, 차자 표기 가운데 가장 체계화된 방식이다."},
B5:{t:'c',q:"향가 한 구절 <span class='hj'>去隱春</span> — '간 봄'. <em>'가-'(去), '봄'(春)처럼 뜻을 지닌 실질 형태소는 어떻게 적었는가?</em>",o:["한자의 뜻을 빌려(훈차)","한자의 소리를 빌려(음차)","소리 나는 대로 이어 적어","획을 더해 새 글자를 만들어"],w:"향찰에서 <b>실질 형태소는 훈차</b>. 去(갈 거)의 뜻 '가-', 春(봄 춘)의 뜻 '봄'을 빌렸다."},
B6:{t:'c',q:"<em>그렇다면 '간'의 '-ㄴ'을 적은 <span class='hj'>隱</span>(숨을 은)처럼, 문법적 구실을 하는 형식 형태소는?</em>",o:["한자의 소리를 빌려(음차)","한자의 뜻을 빌려(훈차)","적지 않고 비워 두어","초성 글자를 다시 써서"],w:"<b>형식 형태소는 음차</b>. 隱은 '숨다'라는 뜻과 상관없이 '은'이라는 소리로 '-ㄴ'을 나타냈다."},
C1:{t:'n',q:"나무 궤에 숫자 자물쇠. 뚜껑 위에 쪽지 — <em>'초성의 글자 수, 그리고 중성의 글자 수'</em>",a:'1711',h:"초성은 열일곱, 중성은 열하나. 이어서 맞춘다.",w:"훈민정음은 <b>초성 17자, 중성 11자</b>로 만들어졌다."},
C2:{t:'c',q:"벽 패널: <em>초성의 기본자 ㄱ ㄴ ㅁ ㅅ ㅇ 은 어떤 원리로 만들었는가?</em>",o:["발음 기관의 모양을 본떴다(상형)","하늘·땅·사람의 모양을 본떴다","기본자에 획을 더했다(가획)","한자의 소리를 빌렸다(음차)"],w:"초성 기본자 다섯은 <b>발음 기관을 본뜬 상형</b>의 원리로 만들었다. 하늘·땅·사람은 중성 기본자다."},
C3:{t:'s',q:"받침대 다섯 개에 글자가 하나씩. <em>아음 → 설음 → 순음 → 치음 → 후음 순서로 기본자를 고르자.</em>",o:["ㄱ","ㄴ","ㅁ","ㅅ","ㅇ"],h:"아(어금니)·설(혀)·순(입술)·치(이)·후(목구멍).",w:"초성 기본자: <b>ㄱ(아음) ㄴ(설음) ㅁ(순음) ㅅ(치음) ㅇ(후음)</b>."},
C5a:{t:'c',q:"탁본대에 찍혀 나온 글자 <span class='big'>ㄴ → ㄷ → ?</span> <em>획을 한 번 더하면?</em>",o:["ㅌ","ㄹ","ㅋ","ㅍ"],w:"<b>가획</b>: 기본자에 획을 더해 만든다. ㄴ → ㄷ → ㅌ. (ㄹ은 가획자가 아니라 이체자다.)"},
C5b:{t:'c',q:"옆 탁본대 <span class='big'>ㅇ → ? → ㅎ</span> <em>가운데 들어갈 글자는?</em>",o:["ㆆ","ㆁ","ㅿ","ㅈ"],w:"ㅇ → <b>ㆆ(여린히읗)</b> → ㅎ. ㆁ(옛이응)은 가획자가 아니라 이체자다."},
C6:{t:'c',q:"금 간 액자. <em>가획의 원리를 따르지 않고 모양을 달리해 만든 '이체자' 셋은?</em>",o:["ㆁ ㄹ ㅿ","ㅋ ㅌ ㅍ","ㄱ ㄴ ㅁ","ㆆ ㅎ ㅊ"],w:"<b>이체자: ㆁ(옛이응) ㄹ ㅿ(반치음)</b>."},
C7:{t:'c',q:"유리장 안에 둥근 점, 평평한 선, 곧게 선 선. <em>중성의 기본자 ㆍ ㅡ ㅣ 가 본뜬 것은 차례로?</em>",o:["하늘 · 땅 · 사람","해 · 달 · 별","혀 · 이 · 입술","목구멍 · 입 · 이"],w:"중성 기본자는 <b>ㆍ(하늘) ㅡ(땅) ㅣ(사람)</b>, 곧 천·지·인을 본뜬 상형이다."},
C8:{t:'c',q:"<em>기본자를 합쳐 만든 글자 가운데 '재출자'만 모은 것은?</em>",o:["ㅛ ㅑ ㅠ ㅕ","ㅗ ㅏ ㅜ ㅓ","ㆍ ㅡ ㅣ","ㄱ ㄴ ㅁ ㅅ"],w:"<b>초출자 ㅗ ㅏ ㅜ ㅓ</b>, <b>재출자 ㅛ ㅑ ㅠ ㅕ</b>. 중성 11자는 상형과 합용의 원리로 만들었다."},
C9:{t:'c',q:"해설 스피커의 잡음 사이로 낱말이 흘러나온다. <em>중세 국어에서 '나무'를 가리킨 말로, 모음 조화가 지켜진 꼴은?</em>",o:["나모","나무","너모","나므"],w:"ㅏ와 ㅗ는 둘 다 <b>양성 모음</b>. 양성은 양성끼리, 음성은 음성끼리 어울리는 <b>모음 조화</b>에 따라 '나모'였다."},
C10:{t:'c',q:"서랍 안쪽에 적힌 여섯 자 <span class='hj'>終聲復用初聲</span>. <em>종성부용초성, 무슨 뜻인가?</em>",o:["종성 글자는 따로 만들지 않고 초성 글자를 다시 쓴다","종성에는 여덟 글자만 쓴다","종성은 소리 내지 않는다","종성을 뒷말의 초성으로 옮겨 적는다"],w:"<b>종성부용초성</b>: 종성은 초성을 다시 쓴다. 글자를 새로 만들지 않아도 되는 경제적인 원리다."},
D1:{t:'c',q:"표본 상자에 글자 다섯이 핀으로 꽂혀 있다. <span class='big'>ㅿ</span> <em>이 글자의 이름은?</em>",o:["반치음","옛이응","여린히읗","아래아"],w:"ㅿ = <b>반치음</b>."},
D2:{t:'c',q:"<span class='big'>ㆁ</span> <em>이 글자의 이름은?</em>",o:["옛이응","여린히읗","반치음","순경음 비읍"],w:"ㆁ = <b>옛이응</b>(꼭지 이응). ㆆ = 여린히읗, ㆍ = 아래아."},
D3:{t:'c',q:"<span class='big'>ㅸ</span> <em>이 글자는?</em>",o:["순경음 비읍 — 가벼운 입술소리","반치음 — 이의 모양을 본뜬 글자","아래아 — 하늘을 본뜬 모음","옛이응 — 꼭지가 달린 이응"],w:"ㅸ = <b>순경음 비읍</b>. 가벼운 입술소리를 적었다."},
D4:{t:'c',q:"감독대 위에 받아 적은 종이. <span class='big'>"+SSAL+"</span>(쌀) <em>이 낱말의 첫머리처럼 초성에 자음이 둘 이상 오는 것을 무엇이라 하는가?</em>",o:["어두 자음군","거듭적기","이체자","8종성법"],w:"<b>어두 자음군</b>: 단어 첫머리에 자음이 둘 이상 오는 것. "+SSAL+"(ㅂ계) · "+KKUM+"(ㅅ계) · "+TTAE+"(ㅄ계)."},
D5:{t:'c',q:"<span class='big'>"+SSAL+"→쌀 &nbsp;"+KKUM+"→꿈 &nbsp;"+TTAE+"→때</span> <em>어두 자음군은 그 뒤 무엇으로 바뀌었는가?</em>",o:["된소리","거센소리","예사소리","소리 없는 글자"],w:"어두 자음군은 사라지면서 <b>된소리</b>로 바뀌었다. 쌀 · 꿈 · 때."},
D6:{t:'c',q:"두루마리 가득, 소리 나는 대로 이어 적은 글씨. <em>'깊은'을 이어적기(연철)로 적으면?</em>",o:["기픈","깊은","깁픈","깊픈"],w:"<b>이어적기(연철)</b>: 앞말의 종성을 뒷말의 초성으로 옮겨 적는다. 깊+은 → 기픈, 믈+은 → 므른."},
D8:{t:'c',q:"<em>두루마리 글씨가 숨 막히게 붙어 있는 까닭, 중세 국어 표기의 또 다른 특징은?</em>",o:["띄어쓰기를 하지 않았다","글자마다 마침표를 찍었다","받침을 적지 않았다","모음을 적지 않았다"],w:"중세 국어는 <b>띄어쓰기를 하지 않았다</b>."},
D7a:{t:'c',q:"서안 귀퉁이의 낙서 <span class='big'>밥을 → 바블 → 밥블</span> <em>'밥블'처럼 받침을 한 번 더 적은 과도기의 표기는?</em>",o:["거듭적기(중철)","이어적기(연철)","끊어적기(분철)","어두 자음군"],w:"<b>거듭적기(중철)</b>: 이어적기에서 끊어적기로 넘어가던 때 잠깐 쓰인 표기. 밥블."},
D7b:{t:'c',q:"<em>오늘날 우리가 '밥을', '사람이'라고 적는 방식은?</em>",o:["끊어적기(분철)","이어적기(연철)","거듭적기(중철)","차자 표기"],w:"<b>끊어적기(분철)</b>: 현대 국어의 표기 방식. 이어적기 → 거듭적기 → 끊어적기."},
D9:{t:'c',q:"서랍 안 쪽지. <em>8종성법에서 받침으로 쓴 여덟 글자는?</em>",o:["ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ ㆁ","ㄱ ㄴ ㄹ ㅁ ㅂ ㅅ ㅇ ㅎ","ㄱ ㄴ ㅁ ㅅ ㅇ ㆁ ㄹ ㅿ","ㄱ ㅋ ㄷ ㅌ ㅂ ㅍ ㅈ ㅊ"],w:"<b>8종성법</b>: 종성에 ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ ㆁ 여덟 자만 썼다."},
D10:{t:'c',q:"<em>근대 국어의 7종성법에서는 여덟 글자 가운데 무엇이 빠졌는가?</em>",o:["ㄷ","ㅅ","ㄹ","ㅂ"],w:"<b>7종성법</b>(근대 국어): ㅅ과 ㄷ이 헷갈리면서 받침 <b>ㄷ을 ㅅ으로</b> 적게 되었다."},
D11:{t:'c',q:"서랍 바닥에 긁어 쓴 글씨. <em>중세 국어의 음운에 대한 설명으로 알맞은 것은?</em>",o:["된소리가 등장했고, 구개음화는 일어나지 않았다","된소리가 없었고, 구개음화가 활발했다","된소리도 구개음화도 없었다","구개음화가 일어나 된소리가 사라졌다"],w:"중세 국어에는 <b>된소리가 등장</b>했고, <b>구개음화는 아직 일어나지 않았다</b>."},
E1:{t:'c',q:"첫 번째 빈칸. <em>하늘의 둥근 모양을 본뜬 중성 기본자, 아래아.</em>",o:["ㆍ","ㅿ","ㆁ","ㆆ"],w:"<b>ㆍ</b> 아래아. 빈칸에 점 하나가 돌아왔다."},
E2:{t:'c',q:"두 번째 빈칸. <em>ㅇ에 획을 더해 만든 글자, 여린히읗.</em>",o:["ㆆ","ㆁ","ㅿ","ㆍ"],w:"<b>ㆆ</b> 여린히읗. ㅇ → ㆆ → ㅎ."},
E3:{t:'c',q:"세 번째 빈칸. <em>꼭지가 달린 이응, 옛이응.</em>",o:["ㆁ","ㆆ","ㆍ","ㅿ"],w:"<b>ㆁ</b> 옛이응. 이체자이며, 8종성 가운데 하나."},
E4:{t:'c',q:"마지막 빈칸. <em>이체자 가운데 하나, 반치음.</em>",o:["ㅿ","ㆁ","ㆆ","ㆍ"],w:"<b>ㅿ</b> 반치음. 네 글자가 모두 돌아왔다."}
};

/* ───── 바랜 것: 마당마다 움직임이 다르다. 문제를 푸는 동안에도 (느리게) 다가오고, 맞히면 빛에 밀려난다 ───── */
function mkEr(p,ms,kind,pts){return{x:p[0],y:p[1],fx:p[0],fy:p[1],mt:999,t:0,ms:ms,sleep:1600,kind:kind,vis:true,pt:0,warn:0,pts:pts,alt:0,big:0,tr:[],trT:0}}
function farPt(e){var p=e.pts.slice();p.sort(function(a,b){return(Math.abs(b[0]-G.px)+Math.abs(b[1]-G.py))-(Math.abs(a[0]-G.px)+Math.abs(a[1]-G.py))});return p[Math.min(e.alt,p.length-1)]}
function erDist(e){return Math.abs(e.x-G.px)+Math.abs(e.y-G.py)}
function near(){var m=99,i,e;for(i=0;i<G.ers.length;i++){e=G.ers[i];if(e.vis)m=Math.min(m,erDist(e))}return m}
function dmap(){var dist=[],q=[[G.px,G.py]],i,c,x,y,k;for(i=0;i<W*H;i++)dist[i]=-1;dist[G.py*W+G.px]=0;
  while(q.length){c=q.shift();for(k=0;k<4;k++){x=c[0]+DX[k];y=c[1]+DY[k];if(x<0||y<0||x>=W||y>=H||dist[y*W+x]>=0||solid(x,y))continue;dist[y*W+x]=dist[c[1]*W+c[0]]+1;q.push([x,y])}}return dist}
function spawnEr(){var c=G.c,k=c.er.kind,e,p;G.erOn=true;
  e=mkEr([0,0],c.er.ms,k=='twin'?'walk':k,c.er.pts);p=farPt(e);e.x=e.fx=p[0];e.y=e.fy=p[1];G.ers=[e];
  if(k=='twin'){e=mkEr([0,0],c.er.ms+110,'walk',c.er.pts);e.alt=1;p=farPt(e);e.x=e.fx=p[0];e.y=e.fy=p[1];e.sleep=2600;G.ers.push(e)}
  if(k=='blink'){e.vis=false;e.pt=3500}
  G.black=700;G.shake=250;sfx.sting();say(c.er.say)}
function puff(e){burst(e.x*16+8,e.y*16+4,10,'#dcdbd0',.045);sfx.puff()}
function erHome(e,sl){var p=farPt(e);e.x=e.fx=p[0];e.y=e.fy=p[1];e.sleep=sl;e.mt=999;e.t=0;e.tr=[];if(e.kind=='blink'){e.vis=false;e.pt=sl+1500;e.warn=0}}
function erStep(e){var x,y,k,i,best=-1,bd=1e9,dist,dx,dy;
  if(e.kind=='phase'){dx=G.px-e.x;dy=G.py-e.y;if(!dx&&!dy)return;best=Math.abs(dx)>=Math.abs(dy)?(dx>0?1:3):(dy>0?2:0)}
  else{dist=dmap();for(k=0;k<4;k++){x=e.x+DX[k];y=e.y+DY[k];if(x<0||y<0||x>=W||y>=H)continue;i=dist[y*W+x];if(i>=0&&i<bd){bd=i;best=k}}}
  if(best>=0){e.fx=e.x;e.fy=e.y;e.x+=DX[best];e.y+=DY[best];e.mt=0}}
function blinkIn(e){var d=dmap(),c=[],x,y,v,p;for(y=2;y<10;y++)for(x=1;x<19;x++){v=d[y*W+x];if(v>=5&&v<=7)c.push([x,y])}
  if(!c.length){e.pt=1500;return}p=c[Math.floor(Math.random()*c.length)];e.x=e.fx=p[0];e.y=e.fy=p[1];e.vis=true;e.pt=3400;e.sleep=650;e.mt=999;e.t=0;e.tr=[];G.white=.22;G.shake=200;sfx.sting();puff(e)}
function erUpdate(e,dt){var d;e.mt+=dt;
  if(e.kind=='blink'){e.pt-=dt;
    if(!e.vis){if(e.pt<1000&&!e.warn){e.warn=1;G.black=420;sfx.riser()}if(e.pt<=0)blinkIn(e);return}
    if(e.pt<=0){puff(e);e.vis=false;e.pt=rnd(3600,6200);e.warn=0;return}}
  if(e.sleep>0){e.sleep-=dt;return}
  e.t+=dt;if(e.t>=e.ms){e.t=0;erStep(e);d=erDist(e);if(d<12)sfx.mstep(Math.max(.012,.13-d*.011),(e.x-G.px)/8)}
  if(e.x==G.px&&e.y==G.py)caught(e)}
function caught(e){G.lead--;G.flash=1;G.shake=420;G.glitch=340;sfx.bad();hud();burst(G.px*16+8,G.py*16+6,10,'#e6e5da',.06);erHome(e,2800);
  if(G.lead<=0){endBad();return}
  if(M=='quiz'&&QZ){QZ.msg='차가운 것이 스쳤다. 초롱 불이 한 칸 사그라든다.';QZ.hit=1;qzDraw()}
  else if(!G.erSeen){G.erSeen=true;say(["차가운 것이 스쳤다. 불이 흔들리고, 방금까지 알던 것 하나가 하얗게 비었다."])}}

function stepTo(d){G.dir=d;var nx=G.px+DX[d],ny=G.py+DY[d];if(solid(nx,ny)){idle();return}G.fx=G.px;G.fy=G.py;G.px=nx;G.py=ny;G.mt=0;G.moving=true;sfx.step()}
function stepDone(){var i,e;idle();for(i=0;i<G.ers.length;i++){e=G.ers[i];if(e.vis&&e.x==G.px&&e.y==G.py){caught(e);return}}emCheck()}
function update(dt){var i,d;G.t+=dt;
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt/500);if(G.white>0)G.white=Math.max(0,G.white-dt/450);
  if(G.shake>0)G.shake-=dt;if(G.black>0)G.black-=dt;if(G.pulse>0)G.pulse-=dt;if(G.face>0)G.face-=dt;if(G.glitch>0)G.glitch-=dt;
  if(G.toastT>0){G.toastT-=dt;if(G.toastT<=0)idle()}
  fxUpdate(dt);
  if(M=='say')sayTick(dt);
  if(G.moving){G.mt+=dt;if(G.mt>=MV){G.moving=false;G.fx=G.px;G.fy=G.py;stepDone()}}
  if(M!='play'&&M!='quiz'){if(G.dng>0){G.dng=Math.max(0,G.dng-dt/1500);G.dngT-=dt;if(G.dngT<=0){G.dngT=300;aDanger(G.dng*.6)}}return}
  if(M=='play'&&!G.moving){if(held>=0)stepTo(held);else if(tapd>=0){stepTo(tapd);tapd=-1}}
  for(i=0;i<G.ers.length&&(M=='play'||M=='quiz');i++)erUpdate(G.ers[i],dt*(M=='quiz'?QSLOW:1));
  if(M!='play'&&M!='quiz')return;
  if(M=='play')emUpdate(dt);
  d=near();G.dng=G.ers.length&&d<90?Math.max(0,Math.min(1,1-(d-1)/8)):0;
  G.dngT-=dt;if(G.dngT<=0){G.dngT=220;aDanger(G.dng);if(M=='quiz')qzDist()}
  if(G.ers.length&&d<10){G.beat-=dt;if(G.beat<=0){G.beat=Math.max(300,230+d*80);sfx.beat(Math.max(.03,.22-d*.02))}}}
function loop(t){var dt=Math.min(60,t-T0||16);T0=t;if(dt>44)slow++;else if(slow>0)slow--;if(slow>70)QL=0;if(G){update(dt);draw()}requestAnimationFrame(loop)}
