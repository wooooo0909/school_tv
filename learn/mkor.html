<style>
:root{color-scheme:dark;--bg:#06080b;--panel:#0d1117;--edge:#283040;--fg:#d8dacd;--dim:#868e9b;--chalk:#eef0e2;--amber:#cfa95f;--red:#d0604e;--green:#86b592;--whisper:#9db0c8;--btn:#131922;--btn2:#1b212c;
--serif:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif;--sans:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding-block:8px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fit{margin:0 auto;max-width:max(288px,min(868px,calc((100vh - 270px)*1.818)))}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--dim);padding:4px 0 6px;min-height:34px}
.hud b{color:var(--fg);font-family:var(--serif);font-weight:700;letter-spacing:.04em;margin-right:10px}
.hud .rt{display:flex;align-items:center}
.lead{display:inline-flex;align-items:center;margin-left:10px}
.lead i{width:9px;height:13px;background:var(--amber);margin-left:5px;border-radius:50% 50% 50% 50%/68% 68% 32% 32%;box-shadow:0 0 6px rgba(207,169,95,.7)}
.lead i.x{background:#2a2f38;box-shadow:none}

.hb:hover{color:var(--amber);border-color:var(--amber)}
.screen{position:relative;border:1px solid var(--edge);background:#000;overflow:hidden}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.panel{min-height:150px;background:var(--panel);border-top:1px solid var(--edge);padding:14px 16px;font-family:var(--serif);font-size:17px;line-height:1.7}
.say{cursor:pointer;position:relative;min-height:120px}
.say p{margin:0;white-space:pre-wrap;word-break:keep-all}
.say.ch p{font-family:'Nanum Pen Script',var(--serif);font-size:30px;line-height:1.3;color:var(--chalk);letter-spacing:.06em;word-break:break-all}
.say.wh p{color:var(--whisper);letter-spacing:.14em}
.say.ok{border-left:3px solid var(--green);padding-left:12px}
.say.ok p b{color:var(--chalk)}
.nx{position:absolute;right:0;bottom:0;color:var(--amber);font-size:13px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
.idle{font-family:var(--sans);font-size:14px;color:var(--dim)}
.idle b{color:var(--amber);font-weight:400}
.qq{margin:0 0 10px;word-break:keep-all}
.qq em{font-style:normal;color:var(--chalk);font-weight:700}
.hj{font-size:1.25em;letter-spacing:.12em;color:var(--chalk)}
.qo{display:flex;flex-wrap:wrap;margin:-4px}
.qb{flex:1 1 44%;margin:4px;min-width:0;text-align:left;background:var(--btn);color:var(--fg);border:1px solid var(--edge);padding:10px 12px;font:inherit;font-size:16px;line-height:1.4;border-radius:2px;cursor:pointer;word-break:keep-all}
.qb i{font-style:normal;color:var(--dim);margin-right:8px;font-family:var(--sans);font-size:12px}
.qb.sel{border-color:var(--amber);background:var(--btn2)}
.qb.dead{opacity:.32;text-decoration:line-through;cursor:default}
.qb.done{border-color:var(--green);color:var(--green)}
.qm{margin:8px 0 0;color:var(--red);font-size:14px;min-height:1.5em;font-family:var(--sans)}
.dial{display:flex;justify-content:center;align-items:center;margin:2px 0}
.dg{width:48px;margin:0 5px;text-align:center}
.dg button{display:block;width:100%;background:none;border:0;color:var(--dim);font-size:15px;padding:3px;cursor:pointer}
.dg b{display:block;font:700 30px/1.35 var(--serif);border:1px solid var(--edge);background:var(--btn);color:var(--fg)}
.dg.sel b{border-color:var(--amber);color:var(--amber)}
.dok{margin-left:12px;background:var(--btn);border:1px solid var(--amber);color:var(--amber);font:inherit;font-size:15px;padding:10px 14px;cursor:pointer}
.os{width:1.2em;height:1.2em;vertical-align:-.22em;fill:currentColor}
.os text{font-family:var(--sans);font-weight:700}
.big{font-size:1.5em;color:var(--chalk);margin:0 .15em}
.big .os{width:1.45em;height:1.45em;vertical-align:-.3em}
.ov{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(5,7,10,.9);overflow-y:auto;padding:16px;text-align:center;z-index:5}
.ov h1{font:700 clamp(32px,8vw,60px)/1.15 var(--serif);letter-spacing:.2em;margin:3% 0 2px;padding-left:.2em;color:var(--chalk)}
.ov h2{font:700 24px/1.3 var(--serif);color:var(--chalk);margin:10px 0 12px;letter-spacing:.06em}
.ov h3{font:700 15px/1.4 var(--serif);color:var(--amber);margin:18px 0 6px;letter-spacing:.06em}
.lost{margin:0 0 4px;font-size:22px;color:var(--amber);letter-spacing:.9em;padding-left:.9em}
.lost span{animation:fl 5s infinite}
.lost span:nth-child(2){animation-delay:1.3s}.lost span:nth-child(3){animation-delay:2.9s}.lost span:nth-child(4){animation-delay:.6s}
@keyframes fl{0%,62%,100%{opacity:1}66%{opacity:.08}70%{opacity:.8}74%{opacity:.05}82%{opacity:1}}
.sub,.who,.fine{color:var(--dim);font-size:13px;margin:4px 0 12px;word-break:keep-all}
.fine{margin-top:14px;font-size:12px}
.mi{display:block;width:100%;max-width:300px;margin:5px auto;padding:9px 12px;background:transparent;border:1px solid transparent;color:var(--fg);font:400 17px/1.4 var(--serif);cursor:pointer;border-radius:2px}
.mi small{display:block;font-size:12px;color:var(--dim);font-family:var(--sans)}
.mi.sel{border-color:var(--amber);color:var(--amber)}
.mi[disabled]{opacity:.3;cursor:default}
.lg{font:700 30px/1.2 var(--serif);letter-spacing:.14em;margin:6px 0 8px;color:var(--chalk)}
.lg span{color:var(--amber)}
.kp{display:flex;flex-wrap:wrap;justify-content:center;width:204px;margin:0 auto 4px}
.mi.kb{display:inline-block;width:60px;margin:4px;padding:7px 0;border-color:var(--edge);font-family:var(--sans);font-size:18px}
.mi.kb.sel{border-color:var(--amber)}
.lmsg{color:var(--red);font-size:13px;min-height:1.5em;margin:0}
.list{text-align:left;max-width:640px;margin:0 auto;font-size:14.5px;line-height:1.65}
.list p{margin:0 0 7px;padding-left:14px;text-indent:-14px;word-break:keep-all}
.list p.no{color:#4c5462}
.list b{color:var(--chalk)}
.endk{color:var(--amber);font-size:12px;letter-spacing:.3em;margin:8% 0 0}
.endt{max-width:520px;margin:0 auto 14px;font:400 17px/1.9 var(--serif)}
.endt p{margin:0;opacity:0;animation:up .9s forwards;word-break:keep-all}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{position:absolute;left:0;right:0;top:0;bottom:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.82);pointer-events:none;transition:opacity .6s;text-align:center;padding:16px}
.card b{font:700 clamp(22px,5vw,38px)/1.3 var(--serif);color:var(--chalk);letter-spacing:.1em}
.card span{color:var(--amber);font-size:13px;letter-spacing:.3em;margin-top:8px}
.card.out{opacity:0}
.pad{display:none;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--panel);border-top:1px solid var(--edge);-webkit-user-select:none;user-select:none;touch-action:none}
.touch .pad{display:flex}
.dp{position:relative;width:138px;height:138px;flex:none}
.dp button,.ab{position:absolute;width:46px;height:46px;background:var(--btn);border:1px solid var(--edge);color:var(--dim);font-size:18px;border-radius:6px;touch-action:none}
.dp button:active,.ab:active{border-color:var(--amber);color:var(--amber)}
.ab{position:static;width:86px;height:86px;border-radius:50%;font:400 17px var(--serif);color:var(--fg)}
.tvk{display:none}
.tv body{overflow:hidden}
.tv .wrap{max-width:none;margin:0;padding:112px 30px 0}
.tv .fit{max-width:none}
.tv .hud{font-size:24px;min-height:64px;padding:0 4px 12px}
.tv .hud b{font-size:30px;margin-right:18px}
.tv .hb{display:none}
.tv .lead{margin-left:16px}
.tv .lead i{width:16px;height:24px;margin-left:9px}
.tv .screen{display:flex;height:706px}
.tv canvas{width:1280px;height:704px;flex:none}
.tv .panel{flex:1;min-width:0;min-height:0;border-top:0;border-left:1px solid var(--edge);padding:28px 26px;font-size:28px;line-height:1.6;overflow:hidden}
.tv .say{min-height:640px}
.tv .say.ch p{font-size:54px}
.tv .idle{font-size:24px;line-height:1.8}
.tv .qq{margin-bottom:16px}
.tv .qb{flex:1 1 100%;font-size:25px;padding:13px 16px;margin:6px 4px}
.tv .qb i{font-size:19px;margin-right:12px}
.tv .qm{font-size:21px;margin-top:12px}
.tv .dial{flex-wrap:wrap;margin-top:20px}
.tv .dg{width:84px;margin:0 8px}
.tv .dg b{font-size:56px}
.tv .dg button{font-size:22px}
.tv .dok{display:block;width:60%;margin:22px auto 0;font-size:24px}
.tv .ov{padding:30px}
.tv .ov h1{font:700 104px/1.15 var(--serif);letter-spacing:.2em;margin:26px 0 6px;padding-left:.2em}
.tv .ov h2{font-size:44px;margin:16px 0}
.tv .ov h3{font-size:26px;margin-top:26px}
.tv .lost{font-size:40px}
.tv .sub,.tv .who,.tv .fine{font-size:24px;margin-bottom:18px}
.tv .mi{font-size:31px;max-width:640px;padding:11px 16px;margin:7px auto}
.tv .mi small{font-size:20px}
.tv .list{max-width:1320px;font-size:25px}
.tv .list p{margin-bottom:10px;padding-left:22px;text-indent:-22px}
.tv .endk{font-size:22px;margin-top:34px}
.tv .endt{max-width:1150px;font-size:32px}
.tv .card b{font:700 64px/1.3 var(--serif);letter-spacing:.1em}
.tv .card span{font-size:26px;margin-top:14px}
.tv .tvk{display:block;margin-top:22px;text-align:center;color:var(--dim);font-size:23px}
.tv .tvk b{display:inline-block;min-width:44px;padding:2px 12px;margin:0 8px 0 26px;border:1px solid var(--edge);border-radius:6px;color:var(--fg);font-weight:400}
@media(max-width:560px){.qb{flex-basis:100%}.panel{font-size:16px;padding:12px}.ov h1{margin-top:0}.say.ch p{font-size:26px}}
@media(prefers-reduced-motion:reduce){.lost span,.nx{animation:none}}
</style>

var Q={
P1:{t:'c',q:"<em>'훈민정음'은 무엇의 이름인가?</em>",o:["문자의 이름이자, 그 문자를 풀이한 책의 이름","문자의 이름일 뿐, 그런 책은 없다","책의 이름일 뿐, 문자는 처음부터 '한글'이라 불렸다","집현전 학자들의 모임 이름"],w:"훈민정음은 세종이 만든 <b>문자의 이름</b>이면서, 그 문자를 풀이한 <b>책 『훈민정음』(해례본)</b>의 이름이기도 하다."},
P2:{t:'n',q:"문에 네 자리 번호 자물쇠가 걸려 있다. 손잡이에 먹글씨 — <em>'글자가 태어난 해'</em>",a:'1443',h:"멈춘 전광 시계를 떠올리자. 14:43.",w:"문자 훈민정음은 <b>1443년</b>에 세종이 창제했다. 책 『훈민정음』(해례본)은 3년 뒤인 <b>1446년</b>에 나왔다."},

B2:{t:'c',q:"책등에 <span class='hj'>天</span> — 하늘(훈) 천(음). <em>뜻은 버리고 '천'이라는 소리만 빌려 적었다면?</em>",o:["음차","훈차","가획","상형"],w:"한자의 <b>소리(음)</b>를 빌리면 <b>음차</b>."},
B3:{t:'c',q:"<em>반대로 '하늘'이라는 우리말을 적으려고 <span class='hj'>天</span>의 뜻을 빌렸다면?</em>",o:["훈차","음차","이체","합용"],w:"한자의 <b>뜻(훈)</b>을 빌리면 <b>훈차</b>."},
B4:{t:'c',q:"얇은 책 한 권이 혼자 삐져나와 있다. <em>향가를 적는 데 쓰인, 차자 표기 가운데 가장 체계적인 표기는?</em>",o:["향찰","훈민정음","끊어적기","8종성법"],w:"<b>향찰</b>은 향가를 표기한 문자로, 차자 표기 가운데 가장 체계화된 방식이다."},
B5:{t:'c',q:"향가 한 구절 <span class='hj'>去隱春</span> — '간 봄'. <em>'가-'(去), '봄'(春)처럼 뜻을 지닌 실질 형태소는 어떻게 적었는가?</em>",o:["한자의 뜻을 빌려(훈차)","한자의 소리를 빌려(음차)","소리 나는 대로 이어 적어","획을 더해 새 글자를 만들어"],w:"향찰에서 <b>실질 형태소는 훈차</b>. 去(갈 거)의 뜻 '가-', 春(봄 춘)의 뜻 '봄'을 빌렸다."},
B6:{t:'c',q:"<em>그렇다면 '간'의 '-ㄴ'을 적은 <span class='hj'>隱</span>(숨을 은)처럼, 문법적 구실을 하는 형식 형태소는?</em>",o:["한자의 소리를 빌려(음차)","한자의 뜻을 빌려(훈차)","적지 않고 비워 두어","초성 글자를 다시 써서"],w:"<b>형식 형태소는 음차</b>. 隱은 '숨다'라는 뜻과 상관없이 '은'이라는 소리로 '-ㄴ'을 나타냈다."},
C1:{t:'n',q:"나무 궤에 숫자 자물쇠. 뚜껑 위에 쪽지 — <em>'초성의 글자 수, 그리고 중성의 글자 수'</em>",a:'1711',h:"초성은 열일곱, 중성은 열하나. 이어서 맞춘다.",w:"훈민정음은 <b>초성 17자, 중성 11자</b>로 만들어졌다."},
C2:{t:'c',q:"벽 패널: <em>초성의 기본자 ㄱ ㄴ ㅁ ㅅ ㅇ 은 어떤 원리로 만들었는가?</em>",o:["발음 기관의 모양을 본떴다(상형)","하늘·땅·사람의 모양을 본떴다","기본자에 획을 더했다(가획)","한자의 소리를 빌렸다(음차)"],w:"초성 기본자 다섯은 <b>발음 기관을 본뜬 상형</b>의 원리로 만들었다. 하늘·땅·사람은 중성 기본자다."},
C3:{t:'s',q:"받침대 다섯 개에 글자가 하나씩. <em>아음 → 설음 → 순음 → 치음 → 후음 순서로 기본자를 고르자.</em>",o:["ㄱ","ㄴ","ㅁ","ㅅ","ㅇ"],h:"아(어금니)·설(혀)·순(입술)·치(이)·후(목구멍).",w:"초성 기본자: <b>ㄱ(아음) ㄴ(설음) ㅁ(순음) ㅅ(치음) ㅇ(후음)</b>."},
C5a:{t:'c',q:"탁본대에 찍혀 나온 글자 <span class='big'>ㄴ → ㄷ → ?</span> <em>획을 한 번 더하면?</em>",o:["ㅌ","ㄹ","ㅋ","ㅍ"],w:"<b>가획</b>: 기본자에 획을 더해 만든다. ㄴ → ㄷ → ㅌ. (ㄹ은 가획자가 아니라 이체자다.)"},
C5b:{t:'c',q:"옆 탁본대 <span class='big'>ㅇ → ? → ㅎ</span> <em>가운데 들어갈 글자는?</em>",o:["ㆆ","ㆁ","ㅿ","ㅈ"],w:"ㅇ → <b>ㆆ(여린히읗)</b> → ㅎ. ㆁ(옛이응)은 가획자가 아니라 이체자다."},
C6:{t:'c',q:"금 간 액자. <em>가획의 원리를 따르지 않고 모양을 달리해 만든 '이체자' 셋은?</em>",o:["ㆁ ㄹ ㅿ","ㅋ ㅌ ㅍ","ㄱ ㄴ ㅁ","ㆆ ㅎ ㅊ"],w:"<b>이체자: ㆁ(옛이응) ㄹ ㅿ(반치음)</b>."},
C7:{t:'c',q:"유리장 안에 둥근 점, 평평한 선, 곧게 선 선. <em>중성의 기본자 ㆍ ㅡ ㅣ 가 본뜬 것은 차례로?</em>",o:["하늘 · 땅 · 사람","해 · 달 · 별","혀 · 이 · 입술","목구멍 · 입 · 이"],w:"중성 기본자는 <b>ㆍ(하늘) ㅡ(땅) ㅣ(사람)</b>, 곧 천·지·인을 본뜬 상형이다."},
C8:{t:'c',q:"<em>기본자를 합쳐 만든 글자 가운데 '재출자'만 모은 것은?</em>",o:["ㅛ ㅑ ㅠ ㅕ","ㅗ ㅏ ㅜ ㅓ","ㆍ ㅡ ㅣ","ㄱ ㄴ ㅁ ㅅ"],w:"<b>초출자 ㅗ ㅏ ㅜ ㅓ</b>, <b>재출자 ㅛ ㅑ ㅠ ㅕ</b>. 중성 11자는 상형과 합용의 원리로 만들었다."},
C9:{t:'c',q:"해설 스피커의 잡음 사이로 낱말이 흘러나온다. <em>중세 국어에서 '나무'를 가리킨 말로, 모음 조화가 지켜진 꼴은?</em>",o:["나모","나무","너모","나므"],w:"ㅏ와 ㅗ는 둘 다 <b>양성 모음</b>. 양성은 양성끼리, 음성은 음성끼리 어울리는 <b>모음 조화</b>에 따라 '나모'였다."},
C10:{t:'c',q:"서랍 안쪽에 적힌 여섯 자 <span class='hj'>終聲復用初聲</span>. <em>종성부용초성, 무슨 뜻인가?</em>",o:["종성 글자는 따로 만들지 않고 초성 글자를 다시 쓴다","종성에는 여덟 글자만 쓴다","종성은 소리 내지 않는다","종성을 뒷말의 초성으로 옮겨 적는다"],w:"<b>종성부용초성</b>: 종성은 초성을 다시 쓴다. 글자를 새로 만들지 않아도 되는 경제적인 원리다."},
D1:{t:'c',q:"표본 상자에 글자 다섯이 핀으로 꽂혀 있다. <span class='big'>ㅿ</span> <em>이 글자의 이름은?</em>",o:["반치음","옛이응","여린히읗","아래아"],w:"ㅿ = <b>반치음</b>."},
D2:{t:'c',q:"<span class='big'>ㆁ</span> <em>이 글자의 이름은?</em>",o:["옛이응","여린히읗","반치음","순경음 비읍"],w:"ㆁ = <b>옛이응</b>(꼭지 이응). ㆆ = 여린히읗, ㆍ = 아래아."},
D3:{t:'c',q:"<span class='big'>ㅸ</span> <em>이 글자는?</em>",o:["순경음 비읍 — 가벼운 입술소리","반치음 — 이의 모양을 본뜬 글자","아래아 — 하늘을 본뜬 모음","옛이응 — 꼭지가 달린 이응"],w:"ㅸ = <b>순경음 비읍</b>. 가벼운 입술소리를 적었다."},
D4:{t:'c',q:"감독대 위에 받아 적은 종이. <span class='big'>"+SSAL+"</span>(쌀) <em>이 낱말의 첫머리처럼 초성에 자음이 둘 이상 오는 것을 무엇이라 하는가?</em>",o:["어두 자음군","거듭적기","이체자","8종성법"],w:"<b>어두 자음군</b>: 단어 첫머리에 자음이 둘 이상 오는 것. "+SSAL+"(ㅂ계) · "+KKUM+"(ㅅ계) · "+TTAE+"(ㅄ계)."},
D5:{t:'c',q:"<span class='big'>"+SSAL+"→쌀 &nbsp;"+KKUM+"→꿈 &nbsp;"+TTAE+"→때</span> <em>어두 자음군은 그 뒤 무엇으로 바뀌었는가?</em>",o:["된소리","거센소리","예사소리","소리 없는 글자"],w:"어두 자음군은 사라지면서 <b>된소리</b>로 바뀌었다. 쌀 · 꿈 · 때."},
D6:{t:'c',q:"두루마리 가득, 소리 나는 대로 이어 적은 글씨. <em>'깊은'을 이어적기(연철)로 적으면?</em>",o:["기픈","깊은","깁픈","깊픈"],w:"<b>이어적기(연철)</b>: 앞말의 종성을 뒷말의 초성으로 옮겨 적는다. 깊+은 → 기픈, 믈+은 → 므른."},
D8:{t:'c',q:"<em>두루마리 글씨가 숨 막히게 붙어 있는 까닭, 중세 국어 표기의 또 다른 특징은?</em>",o:["띄어쓰기를 하지 않았다","글자마다 마침표를 찍었다","받침을 적지 않았다","모음을 적지 않았다"],w:"중세 국어는 <b>띄어쓰기를 하지 않았다</b>."},
D7a:{t:'c',q:"서안 귀퉁이의 낙서 <span class='big'>밥을 → 바블 → 밥블</span> <em>'밥블'처럼 받침을 한 번 더 적은 과도기의 표기는?</em>",o:["거듭적기(중철)","이어적기(연철)","끊어적기(분철)","어두 자음군"],w:"<b>거듭적기(중철)</b>: 이어적기에서 끊어적기로 넘어가던 때 잠깐 쓰인 표기. 밥블."},
D7b:{t:'c',q:"<em>오늘날 우리가 '밥을', '사람이'라고 적는 방식은?</em>",o:["끊어적기(분철)","이어적기(연철)","거듭적기(중철)","차자 표기"],w:"<b>끊어적기(분철)</b>: 현대 국어의 표기 방식. 이어적기 → 거듭적기 → 끊어적기."},
D9:{t:'c',q:"서랍 안 쪽지. <em>8종성법에서 받침으로 쓴 여덟 글자는?</em>",o:["ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ ㆁ","ㄱ ㄴ ㄹ ㅁ ㅂ ㅅ ㅇ ㅎ","ㄱ ㄴ ㅁ ㅅ ㅇ ㆁ ㄹ ㅿ","ㄱ ㅋ ㄷ ㅌ ㅂ ㅍ ㅈ ㅊ"],w:"<b>8종성법</b>: 종성에 ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ ㆁ 여덟 자만 썼다."},
D10:{t:'c',q:"<em>근대 국어의 7종성법에서는 여덟 글자 가운데 무엇이 빠졌는가?</em>",o:["ㄷ","ㅅ","ㄹ","ㅂ"],w:"<b>7종성법</b>(근대 국어): ㅅ과 ㄷ이 헷갈리면서 받침 <b>ㄷ을 ㅅ으로</b> 적게 되었다."},
D11:{t:'c',q:"서랍 바닥에 긁어 쓴 글씨. <em>중세 국어의 음운에 대한 설명으로 알맞은 것은?</em>",o:["된소리가 등장했고, 구개음화는 일어나지 않았다","된소리가 없었고, 구개음화가 활발했다","된소리도 구개음화도 없었다","구개음화가 일어나 된소리가 사라졌다"],w:"중세 국어에는 <b>된소리가 등장</b>했고, <b>구개음화는 아직 일어나지 않았다</b>."},
E1:{t:'c',q:"첫 번째 빈칸. <em>하늘의 둥근 모양을 본뜬 중성 기본자, 아래아.</em>",o:["ㆍ","ㅿ","ㆁ","ㆆ"],w:"<b>ㆍ</b> 아래아. 빈칸에 점 하나가 돌아왔다."},
E2:{t:'c',q:"두 번째 빈칸. <em>ㅇ에 획을 더해 만든 글자, 여린히읗.</em>",o:["ㆆ","ㆁ","ㅿ","ㆍ"],w:"<b>ㆆ</b> 여린히읗. ㅇ → ㆆ → ㅎ."},
E3:{t:'c',q:"세 번째 빈칸. <em>꼭지가 달린 이응, 옛이응.</em>",o:["ㆁ","ㆆ","ㆍ","ㅿ"],w:"<b>ㆁ</b> 옛이응. 이체자이며, 8종성 가운데 하나."},
E4:{t:'c',q:"마지막 빈칸. <em>이체자 가운데 하나, 반치음.</em>",o:["ㅿ","ㆁ","ㆆ","ㆍ"],w:"<b>ㅿ</b> 반치음. 네 글자가 모두 돌아왔다."}
