<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:dark}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>사라진 글자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#040609;--panel:#0b0e14;--edge:#283040;--fg:#d8dacd;--dim:#868e9b;--chalk:#eef0e2;--amber:#cfa95f;--red:#d0604e;--green:#86b592;--whisper:#9db0c8;--btn:#131922;--btn2:#1b212c;--glass:rgba(6,8,12,.88);
--serif:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif;--sans:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{margin:0 auto;padding-block:8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tv body{overflow:hidden;margin:0}
.tv .wrap{padding:0}
.screen{position:relative;margin:0 auto;background:#000;overflow:hidden;border:1px solid var(--edge)}
.tv .screen{border:0}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--dim);padding:6px 10px;min-height:36px;background:var(--panel)}
.hud b{color:var(--fg);font-family:var(--serif);font-weight:700;letter-spacing:.04em;margin-right:.6em}
.hud .rt{display:flex;align-items:center}
.lead{display:inline-flex;align-items:center;margin-left:.6em}
.lead i{width:.7em;height:1em;background:var(--amber);margin-left:.35em;border-radius:50% 50% 50% 50%/68% 68% 32% 32%;box-shadow:0 0 .5em rgba(207,169,95,.8);transition:background-color .4s,box-shadow .4s}
.lead i.x{background:#2a2f38;box-shadow:none}
.lead.low i:not(.x){animation:lw .5s infinite alternate}
@keyframes lw{to{opacity:.45}}
.hb{background:none;border:1px solid var(--edge);color:var(--dim);font:inherit;font-size:12px;padding:3px 8px;margin-left:8px;cursor:pointer;border-radius:2px;pointer-events:auto}
.hb:hover{color:var(--amber);border-color:var(--amber)}
.tv .hb{display:none}
.panel{min-height:150px;background:var(--panel);border-top:1px solid var(--edge);padding:12px 14px;font-family:var(--serif);font-size:16px;line-height:1.7}
.say{cursor:pointer;position:relative;min-height:118px}
.say p{margin:0;white-space:pre-wrap;word-break:keep-all}
.say.ch p{font-family:'Nanum Pen Script',var(--serif);font-size:1.8em;line-height:1.3;color:var(--chalk);letter-spacing:.06em;word-break:break-all;animation:ink 1.2s}
@keyframes ink{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
.say.wh p{color:var(--whisper);letter-spacing:.14em;animation:wv 2.4s infinite}
@keyframes wv{50%{opacity:.55}}
.say.ok{border-left:3px solid var(--green);padding-left:12px}
.say.ok p b{color:var(--chalk)}
.nx{position:absolute;right:.2em;bottom:0;color:var(--amber);font-size:.75em;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
.idle{font-family:var(--sans);font-size:14px;color:var(--dim)}
.idle b{color:var(--amber);font-weight:400}
.qz{animation:qin .35s}
@keyframes qin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qz.hit{animation:hit .35s}
@keyframes hit{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.qd{font-family:var(--sans);font-size:12px;color:var(--dim);margin:0 0 8px}
.qd u{display:block;height:4px;background:#1a2029;margin-top:4px;text-decoration:none;overflow:hidden}
.qd u i{display:block;height:100%;background:var(--amber);transition:width .5s linear,background-color .3s}
.qd.near{color:var(--red)}
.qd.near u i{background:var(--red)}
.qd.near{animation:bl .5s steps(2) infinite}
.qz.okk{border-left:.25em solid var(--green);padding-left:.8em}
.qk{font-family:var(--sans);font-size:.78em;color:var(--dim);margin:0 0 .25em}
.qa{font-size:1.2em;font-weight:700;color:var(--chalk);margin:0;word-break:keep-all}
.qn{font-family:var(--sans);font-size:.78em;color:var(--amber);margin:.7em 0 0}
.qq{margin:0 0 10px;word-break:keep-all}
.qq em{font-style:normal;color:var(--chalk);font-weight:700}
.hj{font-size:1.25em;letter-spacing:.12em;color:var(--chalk)}
.qo{display:flex;flex-wrap:wrap;margin:-4px}
.qb{flex:1 1 100%;margin:4px;min-width:0;text-align:left;background:var(--btn);color:var(--fg);border:1px solid var(--edge);padding:.6em .75em;font:inherit;font-size:.95em;line-height:1.4;border-radius:2px;cursor:pointer;word-break:keep-all;animation:qin .4s backwards}
.qb:nth-child(2){animation-delay:.07s}.qb:nth-child(3){animation-delay:.14s}.qb:nth-child(4){animation-delay:.21s}.qb:nth-child(5){animation-delay:.28s}
.qb i{font-style:normal;color:var(--dim);margin-right:.6em;font-family:var(--sans);font-size:.8em}
.qb.sel{border-color:var(--amber);background:var(--btn2);box-shadow:0 0 .8em rgba(207,169,95,.25)}
.qb.dead{opacity:.32;text-decoration:line-through;cursor:default}
.qb.done{border-color:var(--green);color:var(--green)}
.qm{margin:8px 0 0;color:var(--red);font-size:.82em;min-height:1.5em;font-family:var(--sans)}
.dial{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;margin:2px 0}
.dg{width:3em;margin:0 .3em;text-align:center}
.dg button{display:block;width:100%;background:none;border:0;color:var(--dim);font-size:.9em;padding:3px;cursor:pointer}
.dg b{display:block;font:700 1.9em/1.35 var(--serif);border:1px solid var(--edge);background:var(--btn);color:var(--fg)}
.dg.sel b{border-color:var(--amber);color:var(--amber)}
.dok{margin:.6em 0 0 .8em;background:var(--btn);border:1px solid var(--amber);color:var(--amber);font:inherit;font-size:.9em;padding:.6em .9em;cursor:pointer}
.os{width:1.2em;height:1.2em;vertical-align:-.22em;fill:currentColor}
.os text{font-family:var(--sans);font-weight:700}
.big{font-size:1.5em;color:var(--chalk);margin:0 .15em}
.big .os{width:1.45em;height:1.45em;vertical-align:-.3em}
.ov{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(4,6,9,.93);overflow-y:auto;padding:16px;text-align:center;z-index:6;font-size:16px}
.cine .ov.k-menu,.cine .ov.k-login{background:linear-gradient(rgba(4,6,9,.5),rgba(4,6,9,.86))}
.ov.k-end{animation:ein 1.6s}
@keyframes ein{from{background:rgba(0,0,0,1)}}
.ov h1{font:700 2.3em/1.15 var(--serif);letter-spacing:.2em;margin:.4em 0 .05em;padding-left:.2em;color:var(--chalk);text-shadow:0 0 .6em rgba(238,240,226,.25);animation:tfl 7s infinite}
@keyframes tfl{0%,91%,100%{opacity:1}92%{opacity:.35}93%{opacity:1}95%{opacity:.15}96%{opacity:.9}}
.ov h2{font:700 1.5em/1.3 var(--serif);color:var(--chalk);margin:.5em 0 .6em;letter-spacing:.06em}
.ov h3{font:700 .95em/1.4 var(--serif);color:var(--amber);margin:1.2em 0 .4em;letter-spacing:.06em}
.lost{margin:0 0 .2em;font-size:1.4em;color:var(--amber);letter-spacing:.9em;padding-left:.9em}
.lost span{animation:fl 5s infinite}
.lost span:nth-child(2){animation-delay:1.3s}.lost span:nth-child(3){animation-delay:2.9s}.lost span:nth-child(4){animation-delay:.6s}
@keyframes fl{0%,62%,100%{opacity:1}66%{opacity:.08}70%{opacity:.8}74%{opacity:.05}82%{opacity:1}}
.sub,.who,.fine{color:var(--dim);font-size:.8em;margin:.3em 0 .9em;word-break:keep-all}
.fine{margin-top:1em;font-size:.75em}
.mi{display:block;width:100%;max-width:19em;margin:.3em auto;padding:.5em .75em;background:transparent;border:1px solid transparent;color:var(--fg);font:400 1.05em/1.4 var(--serif);cursor:pointer;border-radius:2px}
.mi small{display:block;font-size:.68em;color:var(--dim);font-family:var(--sans)}
.mi.sel{border-color:var(--amber);color:var(--amber);background:rgba(207,169,95,.07)}
.mi[disabled]{opacity:.3;cursor:default}
.lg{font:700 1.9em/1.2 var(--serif);letter-spacing:.14em;margin:.2em 0 .25em;color:var(--chalk)}
.lg span{color:var(--amber)}
.kp{display:flex;flex-wrap:wrap;justify-content:center;width:14.6em;margin:0 auto .25em}
.mi.kb{display:inline-block;width:3.7em;margin:.25em;padding:.4em 0;border-color:var(--edge);font-family:var(--sans);font-size:1.1em}
.kp{font-size:1em}
.mi.kb.sel{border-color:var(--amber)}
.lmsg{color:var(--red);font-size:.8em;min-height:1.5em;margin:0}
.list{text-align:left;max-width:44em;margin:0 auto;font-size:.9em;line-height:1.65}
.list p{margin:0 0 .5em;padding-left:1em;text-indent:-1em;word-break:keep-all}
.list p.no{color:#4c5462}
.list b{color:var(--chalk)}
.list i{font-style:normal;color:var(--dim)}
.endk{color:var(--amber);font-size:.75em;letter-spacing:.3em;margin:8% 0 0}
.endt{max-width:34em;margin:0 auto 1em;font:400 1.05em/1.9 var(--serif)}
.endt p{margin:0;opacity:0;animation:up .9s forwards;word-break:keep-all}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{position:absolute;left:0;right:0;top:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;pointer-events:none;transition:opacity .9s;text-align:center;padding:16px;font-size:16px}
.card b{font:700 1.7em/1.3 var(--serif);color:var(--chalk);letter-spacing:.14em;animation:ink 1.4s}
.card span{color:var(--amber);font-size:.8em;letter-spacing:.3em;margin-top:.6em;animation:ink 2s}
.card.out{opacity:0}
.err{position:absolute;left:8px;bottom:6px;z-index:9;max-width:92%;font:12px/1.4 var(--sans);color:#ff9a8a;background:rgba(0,0,0,.75);padding:3px 8px;pointer-events:none}
.pad{display:none;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--panel);border-top:1px solid var(--edge);-webkit-user-select:none;user-select:none;touch-action:none}
.touch .pad{display:flex}
.dp{position:relative;width:138px;height:138px;flex:none}
.dp button,.ab{position:absolute;width:46px;height:46px;background:var(--btn);border:1px solid var(--edge);color:var(--dim);font-size:18px;border-radius:6px;touch-action:none;pointer-events:auto}
.dp button:active,.ab:active{border-color:var(--amber);color:var(--amber)}
.ab{position:static;width:86px;height:86px;border-radius:50%;font:400 17px var(--serif);color:var(--fg)}
/* ── 넓은 화면·TV: 화면 전체가 무대, 글은 그 위에 겹쳐 뜬다 (글자 크기는 화면 폭에 비례) ── */
.cine .screen canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.cine .hud{position:absolute;left:0;right:0;top:0;z-index:2;font-size:.7em;padding:1.1em 1.6em 2.2em;min-height:0;background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,0));pointer-events:none}
.cine .hud b{font-size:1.25em}
.cine .hb{font-size:.8em}
.cine .panel{position:absolute;z-index:3;min-height:0;border:0;background:none;padding:0;font-size:1em;line-height:1.65}
.cine .panel.p-say{left:13%;right:13%;bottom:5.5%}
.cine .say{background:var(--glass);border:1px solid var(--edge);padding:1em 1.4em 1.2em;min-height:5.4em;box-shadow:0 0 2.5em rgba(0,0,0,.85);animation:qin .3s}
.cine .say.ch{background:rgba(4,5,8,.7);text-align:center;border-color:transparent}
.cine .say.ch p{font-size:2.3em}
.cine .say.ok{border-left:.25em solid var(--green)}
.cine .nx{right:1em;bottom:.6em}
.cine .panel.p-quiz{top:12%;width:42%}
.cine .panel.p-quiz.rt{right:2.2%}
.cine .panel.p-quiz.lf{left:2.2%}
.cine .qz{background:var(--glass);border:1px solid var(--edge);padding:1em 1.1em 1.1em;box-shadow:0 0 2.5em rgba(0,0,0,.85)}
.cine .qd{font-size:.6em;margin-bottom:.9em}
.cine .qd u{height:.4em;margin-top:.4em}
.cine .qq{font-size:.86em;margin-bottom:.8em}
.cine .qb{font-size:.8em;margin:.3em 4px}
.cine .qm{font-size:.66em;margin-top:.7em}
.cine .panel.p-idle{left:0;right:0;bottom:4.5%;text-align:center;pointer-events:none}
.cine .idle{display:inline-block;background:rgba(6,8,12,.66);padding:.4em 1.2em;border-radius:2em;font-size:.68em;animation:qin .3s}
.cine .ov,.cine .card{font-size:1em}
.cine .ov{padding:1.4em}
.cine .ov h1{font-size:3.5em;margin-top:.25em}
.cine.touch .pad{position:absolute;left:0;right:0;bottom:0;z-index:4;background:none;border:0;pointer-events:none;opacity:.75}
.cine.touch .panel.p-say{left:24%;right:22%}
@media(max-width:560px){.ov h1{margin-top:0}}
@media(prefers-reduced-motion:reduce){.lost span,.nx,.ov h1,.say.wh p{animation:none}}

/* 문지기(빠른 복습) */
.bz{font-family:var(--sans);text-align:center}
.bz.in{padding:.6em 0}
.bn{font-family:var(--serif);font-size:1.9em;font-weight:700;color:var(--chalk);letter-spacing:.24em;margin:0;animation:ink 1.4s}
.bs{color:var(--red);margin:.15em 0 .7em;letter-spacing:.12em}
.bh2{color:var(--dim);font-size:.85em;margin:0;word-break:keep-all}
.bhp{display:flex;align-items:center;font-size:.8em;color:var(--red);margin-bottom:.5em}
.bhp b{font-family:var(--serif);letter-spacing:.12em;white-space:nowrap;margin-right:.7em}
.bhp u{flex:1;height:.5em;background:#1a1012;text-decoration:none;overflow:hidden;border:1px solid #3a1c1c}
.bhp u i{display:block;height:100%;background:var(--red);transition:width .3s}
.btm{height:.35em;background:#1a2029;overflow:hidden;margin-bottom:.7em}
.btm i{display:block;height:100%;background:var(--amber)}
.btm.low i{background:var(--red)}
.bq{font-family:var(--serif);font-size:1.45em;font-weight:700;color:var(--chalk);margin:0 0 .6em;word-break:keep-all}
.bo{display:flex;margin:0 -.3em}
.bb{flex:1;min-width:0;min-height:3.2em;margin:0 .3em;background:var(--btn);border:1px solid var(--edge);color:var(--fg);font:inherit;font-family:var(--serif);font-size:1.05em;padding:.6em .8em;border-radius:.3em;cursor:pointer;word-break:keep-all;display:flex;align-items:center;justify-content:center;text-align:center}
.bb i{font-style:normal;color:var(--amber);font-size:.8em;margin-right:.5em}
.bb.ok{border-color:var(--green);color:var(--chalk);background:#13241a}
.bb.no{border-color:var(--red);background:#2a1414}
.bb.dim{opacity:.4}
.bm{min-height:1.4em;margin:.6em 0 0;color:var(--amber);font-size:.95em;word-break:keep-all}
.bm b{color:var(--chalk)}
.cine .panel.p-boss{left:12%;right:12%;bottom:5%}
.cine .bz:not(.in){background:var(--glass);border:1px solid #3a1c1c;padding:.9em 1.1em 1em;box-shadow:0 0 2.5em rgba(0,0,0,.9)}
.cine .bz.in{background:rgba(4,5,8,.55);padding:1em}
.rv{text-align:left;margin:.4em auto 1em;max-width:34em}
.rv p{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--edge);margin:0;padding:.4em 0;word-break:keep-all}
.rv span{color:var(--dim);margin-right:1em}
.rv b{color:var(--chalk);text-align:right}
.rv .rvh{color:var(--amber);border:0;letter-spacing:.2em;font-size:.85em}
#app.jmp .panel{opacity:.12}
#app.jmp .hud{visibility:hidden}

/* 문제 형식 */
.qf{font-family:var(--sans);font-size:.72em;letter-spacing:.1em;color:var(--amber);margin:0 0 .5em;word-break:keep-all}
.qf span{color:var(--dim);letter-spacing:0}
.qtm{height:.3em;background:#1a2029;margin:0 0 .7em;overflow:hidden}
.qtm i{display:block;height:100%;background:var(--red)}
.qs{margin:.1em 0 .7em;font-size:1.02em;color:var(--chalk);word-break:keep-all}
.qs.prog b{display:inline-block;min-width:1.4em;margin:0 .12em;text-align:center;border-bottom:2px solid var(--edge)}
u.bl{display:inline-block;min-width:3.2em;height:1em;vertical-align:-.15em;border-bottom:2px solid var(--amber);text-decoration:none}
.qo.g2 .qb{flex:1 1 40%}
.qo.g3 .qb{flex:1 1 26%;text-align:center;justify-content:center}
.qo.tl{justify-content:center}
.qo.tl .qb{flex:0 0 auto;min-width:2.6em;text-align:center;font-size:1.2em;padding:.45em .7em}
.qo.tl .qb i{display:none}
.qo.mt .qb:nth-child(odd){font-weight:700;color:var(--chalk)}
.qo.mm .qb{min-height:3.4em;display:flex;align-items:center;justify-content:center;font-size:.85em}
.qo.mm .qb i{display:none}
.qo.sl .qb{padding:.25em .75em;color:var(--dim);border-style:dashed}
.qsp{flex:1 1 100%;margin:1px 8px;color:var(--chalk);font-size:.92em;word-break:keep-all}
.qb.pk{border-color:var(--amber);color:var(--chalk);background:var(--btn2)}
.qb.gone{opacity:.14;text-decoration:line-through;cursor:default}
.mir{transform:scaleX(-1)}
.qz.sv{border-color:#7a2222!important;box-shadow:0 0 2.5em rgba(140,20,20,.55)!important}
.qz.okk.sv .qn{color:var(--green)}
.cine .qf{font-size:.62em}
.cine .qs{font-size:.88em}
</style>

<div class="wrap" id="app">
  <div class="screen" id="screen">
    <div class="hud" id="hud"><div><b id="hudL">사라진 글자</b><span id="hudP"></span></div>
      <div class="rt"><span id="hudN"></span><span class="lead" id="hudB"></span>
        <button class="hb" data-a="mute" id="btM">소리 켬</button><button class="hb" data-a="pause">메뉴</button></div></div>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="pad" id="pad">
      <div class="dp"><button data-d="0" style="left:46px;top:0" aria-label="위">▲</button><button data-d="3" style="left:0;top:46px" aria-label="왼쪽">◀</button><button data-d="1" style="left:92px;top:46px" aria-label="오른쪽">▶</button><button data-d="2" style="left:46px;top:92px" aria-label="아래">▼</button></div>
      <button class="ab" id="btA">살피기</button>
    </div>
    <div class="panel p-idle" id="panel"></div>
    <div class="card out" id="card" hidden></div>
    <div class="ov" id="ov" hidden></div>
    <div class="err" id="err" hidden></div>
  </div>
</div>

<script>
(function(){
'use strict';
var W=20,H=11,S=2,OYL=2,CLASS_MAX=20,MV=150,QSLOW=.4,GATE=7;
var DX=[0,1,0,-1],DY=[-1,0,1,0];
function el(i){return document.getElementById(i)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function hash(x,y){var n=(x*374761393+y*668265263)|0;n=Math.imul?Math.imul(n^(n>>>13),1274126177):((n^(n>>>13))*1274126177)|0;return((n^(n>>>16))>>>0)/4294967295}
function cnt(o){var n=0,k;for(k in o)if(o[k])n++;return n}
function rnd(a,b){return a+Math.random()*(b-a)}

/* ───── 옛 글자 그리기(기기 글꼴과 무관하게 보이도록 낱자를 직접 모아 쓴다) ───── */
function OS(i,v,f,side){
  function g(c,x,y,w,h){return '<text x="50" y="84" font-size="96" text-anchor="middle" transform="translate('+x+','+y+') scale('+(w/100)+','+(h/100)+')">'+c+'</text>'}

  if(G.pulse>0){q=1-G.pulse/750;cx.globalAlpha=(1-q)*.8;cx.strokeStyle='#f2d28a';cx.lineWidth=2.5-q*2;cx.beginPath();cx.arc(mx+8,my+6,8+q*120,0,6.283);cx.stroke();cx.globalAlpha=1}
  cx.setTransform(1,0,0,1,0,0);if(G.bs)bossPaint();
  if(QL>1){q=(t*.012)%640;cx.globalAlpha=.26;cx.drawImage(FOG,-q,0,640,360);cx.drawImage(FOG,640-q,0,640,360);q=(t*.007)%640;cx.globalAlpha=.16;cx.drawImage(FOG,q-640,40,640,360);cx.drawImage(FOG,q,40,640,360);cx.globalAlpha=1}
  cx.drawImage(VG,0,0,640,360);
  if(dng>0){cx.globalAlpha=Math.min(1,dng*(.42+.3*Math.sin(t/(260-dng*130))));cx.drawImage(VR,0,0,640,360);cx.globalAlpha=1}
  if(QL>1){cx.globalAlpha=.45;cx.drawImage(GR[Math.floor(t/90)%3],0,0,640,360);cx.globalAlpha=1}
  if(G.flash>0){cx.fillStyle='rgba(190,40,30,'+(G.flash*.45)+')';cx.fillRect(0,0,640,360)}
  if(G.white>0){cx.fillStyle='rgba(255,236,196,'+G.white+')';cx.fillRect(0,0,640,360)}
  if(G.glitch>0)for(i=0;i<6;i++){ey=Math.floor(Math.random()*340);cx.drawImage(cv,0,ey,640,8+Math.floor(Math.random()*18),Math.round((Math.random()-.5)*46),ey,640,8+Math.floor(Math.random()*18))}
  if(G.face>0)drawFace()}

/* ───── 진행 ───── */
function stepTo(d){G.dir=d;var nx=G.px+DX[d],ny=G.py+DY[d];if(solid(nx,ny)){idle();return}G.fx=G.px;G.fy=G.py;G.px=nx;G.py=ny;G.mt=0;G.moving=true;sfx.step()}
function stepDone(){var i,e;idle();for(i=0;i<G.ers.length;i++){e=G.ers[i];if(e.vis&&e.x==G.px&&e.y==G.py){caught(e);return}}if(G.fk2&&G.px==G.fk2.x&&G.py==G.fk2.y){fakeTrip();return}emCheck()}
function update(dt){var i,d,cb,jj;G.t+=dt;
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt/500);if(G.white>0)G.white=Math.max(0,G.white-dt/450);
  if(G.shake>0)G.shake-=dt;if(G.black>0)G.black-=dt;if(G.pulse>0)G.pulse-=dt;if(G.glitch>0)G.glitch-=dt;if(G.bsR>0)G.bsR-=dt;
  if(G.jq){G.jq.t-=dt;if(G.jq.t<=0){jj=G.jq;G.jq=null;jumpNow(jj.lv,jj.cb)}}else if(G.face>0){G.face-=dt;if(G.face<=0)jumpEnd()}
  if(G.jt>0){G.jt-=dt;if(G.jt<=0)jump(1)}
  if(M=='quiz'&&QZ)qzTick(dt);
  if(G.toastT>0){G.toastT-=dt;if(G.toastT<=0)idle()}
  fxUpdate(dt);
  if(M=='say')sayTick(dt);
  if(G.moving){G.mt+=dt;if(G.mt>=MV){G.moving=false;G.fx=G.px;G.fy=G.py;stepDone()}}
  if(M=='qok'){G.qokT-=dt;if(G.qokT<=0){cb=G.qokCb;G.qokCb=null;M='play';idle();if(cb)cb()}}
  if(M=='boss')bossUpdate(dt);
  if(!lv()){if(G.dng>0){G.dng=Math.max(0,G.dng-dt/1500);G.dngT-=dt;if(G.dngT<=0){G.dngT=300;aDanger(G.dng*.6)}}return}
  if(M=='play'&&!G.moving){if(held>=0)stepTo(held);else if(tapd>=0){stepTo(tapd);tapd=-1}}
  for(i=0;i<G.ers.length&&lv();i++)erUpdate(G.ers[i],dt*(M=='play'?1:QSLOW)*(G.bellB>0?1.7:1));
  if(!lv())return;
  if(M=='play'){emUpdate(dt);blUpdate(dt);if(!lv())return}
  thUpdate(dt);if(!lv())return;
  d=near();G.dng=G.ers.length&&d<90?Math.max(0,Math.min(1,1-(d-1)/8)):0;
  G.dngT-=dt;if(G.dngT<=0){G.dngT=220;aDanger(Math.max(G.dng,G.rage&&G.ers.length?.45:0));if(M=='quiz')qzDist()}
  if(G.ers.length&&d<10){G.beat-=dt;if(G.beat<=0){G.beat=Math.max(280,220+d*78);sfx.beat(Math.max(.03,.22-d*.02))}}}
function now(){return window.performance&&performance.now?performance.now():Date.now()}
var ERRN=0,COST=0,CN=0;
function oops(e){ERRN++;var b=el('err');if(b&&ERRN<4){b.hidden=false;b.textContent='오류: '+String(e&&e.message||e).slice(0,140)+(e&&e.stack?' @'+String(e.stack).split('\n')[1]:'').slice(0,90)}}
function frame(){var t=now(),dt=Math.min(60,t-T0||16),c;T0=t;if(!G)return;
  try{update(dt);draw()}catch(e){oops(e);try{cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1}catch(e2){}}
  c=now()-t;COST+=c;if(++CN>=40){c=COST/CN;COST=0;CN=0;if(c>24&&QL>0)QL--;}}
function loop(){frame();requestAnimationFrame(loop)}
setInterval(function(){if(now()-T0>140)frame()},70);
window.onerror=function(m){oops(m)};

layout();
LG=lsGet('sg_last')||'';if(typeof LG!='string')LG='';
if(TV){var hs=(location.hash||'').replace('#','');load(/^\d{5}$/.test(hs)?hs:null);showMenu()}else{load(null);showLogin()}
requestAnimationFrame(loop);
window.SGTV={key:function(k){onKey(k,null,true)}};
window.SG={Q:Q,CH:CH,fn:{jump:jump,fire:thFire,boss:bossStart,start:startCh,pick:bossPick,scare:scare,ask:ask,fm:FM,surv:survAsk,caught:caught},use:function(o){use(o)},st:function(){return{G:G,M:M,QZ:QZ,SAY:SAY,SV:SV,SID:SID,QL:QL,ERRN:ERRN}}};
})();
