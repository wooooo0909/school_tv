<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이우고 TV 대시보드</title>
<!--
  이우고등학교 TV 대시보드 v2
  대상: 삼성 UN65NU7100 (2018년형 · Tizen 4.0 · Chromium 56)
  - ES5 문법, flexbox 레이아웃, XMLHttpRequest/JSONP 통신
  - 관리자 앱(Google Apps Script)에서 공지·포스터·음악·테마를 원격으로 바꿈
  - 설정은 아래 CONFIG.api 에 관리자 웹 앱 주소를 넣으면 끝
  - 미리보기: ?demo=1  (테마 강제: &theme=light 또는 dark)
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
html{
  --bg:#0b0f14; --surface:#131920; --surface2:#1a212b; --line:rgba(255,255,255,.07);
  --text:#f1f5f9; --sub:#94a3b8; --dim:#5b6b80; --body:#cbd5e1;
  --accent:#2dd4bf; --accentbg:rgba(45,212,191,.12); --warm:#fbbf24; --warmbg:rgba(251,191,36,.12);
  --red:#f87171; --redbg:rgba(248,113,113,.14); --hw:#a5b4fc; --hwbg:rgba(165,180,252,.12);
  --shadow:0 24px 48px rgba(0,0,0,.28);
  --b1:rgba(45,212,191,.07); --b2:rgba(129,140,248,.06); --b3:rgba(251,191,36,.04);
}
html[data-theme=light]{
  --bg:#f1f2f4; --surface:#ffffff; --surface2:#f5f6f8; --line:rgba(15,23,42,.07);
  --text:#0f172a; --sub:#64748b; --dim:#94a3b8; --body:#334155;
  --accent:#0d9488; --accentbg:rgba(13,148,136,.09); --warm:#d97706; --warmbg:rgba(217,119,6,.10);
  --red:#dc2626; --redbg:rgba(220,38,38,.08); --hw:#4f46e5; --hwbg:rgba(79,70,229,.08);
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 32px rgba(15,23,42,.05);
  --b1:rgba(13,148,136,.09); --b2:rgba(79,70,229,.06); --b3:rgba(217,119,6,.05);
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;cursor:none;}
body{background:#0a111d;background:var(--bg);color:var(--text);font-family:"Pretendard","Samsung One Korean","SamsungOneKorean","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;-webkit-transition:background-color 1.2s,color 1.2s;transition:background-color 1.2s,color 1.2s;}
*{box-sizing:border-box;}
ul{list-style:none;margin:0;padding:0;}

/* ── 움직이는 배경 ───────────────── */
#bg{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;}
.blob{position:absolute;width:1100px;height:1100px;border-radius:50%;will-change:transform;}
.b1{left:-300px;top:-420px;background:radial-gradient(closest-side,var(--b1),rgba(255,255,255,0));-webkit-animation:f1 46s ease-in-out infinite alternate;animation:f1 46s ease-in-out infinite alternate;}
.b2{right:-360px;top:120px;background:radial-gradient(closest-side,var(--b2),rgba(255,255,255,0));-webkit-animation:f2 58s ease-in-out infinite alternate;animation:f2 58s ease-in-out infinite alternate;}
.b3{left:30%;bottom:-620px;background:radial-gradient(closest-side,var(--b3),rgba(255,255,255,0));-webkit-animation:f3 52s ease-in-out infinite alternate;animation:f3 52s ease-in-out infinite alternate;}
@-webkit-keyframes f1{from{-webkit-transform:translate(0,0)}to{-webkit-transform:translate(380px,220px) scale(1.15)}}
@keyframes f1{from{transform:translate(0,0)}to{transform:translate(380px,220px) scale(1.15)}}
@-webkit-keyframes f2{from{-webkit-transform:translate(0,0) scale(1.1)}to{-webkit-transform:translate(-420px,-180px)}}
@keyframes f2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-420px,-180px)}}
@-webkit-keyframes f3{from{-webkit-transform:translate(0,0)}to{-webkit-transform:translate(-300px,-160px) scale(1.2)}}
@keyframes f3{from{transform:translate(0,0)}to{transform:translate(-300px,-160px) scale(1.2)}}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;-webkit-transform-origin:0 0;transform-origin:0 0;}
.view{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;visibility:hidden;-webkit-transition:opacity .9s,visibility 0s .9s;transition:opacity .9s,visibility 0s .9s;}
.view.on{opacity:1;visibility:visible;-webkit-transition:opacity .9s;transition:opacity .9s;}

@-webkit-keyframes rise{from{opacity:0;-webkit-transform:translateY(22px)}to{opacity:1;-webkit-transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.rise{-webkit-animation:rise .7s ease-out both;animation:rise .7s ease-out both;}

/* ── 대시보드 ───────────────── */
#dash{padding:52px 64px 0;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;}
#top{height:120px;display:flex;align-items:center;}
.school{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:3px;}
.date{font-size:58px;font-weight:800;margin-top:10px;letter-spacing:-1.5px;line-height:1;white-space:nowrap;}
.date .dow{color:var(--sub);font-weight:300;margin-left:16px;letter-spacing:-1px;}
#top .mid{-webkit-flex:1;flex:1;display:flex;justify-content:center;min-width:0;padding:0 32px;}
.nextcls{display:none;align-items:center;height:76px;padding:0 12px 0 30px;border-radius:38px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-width:600px;min-width:0;}
.nextcls.on{display:flex;}
.nextcls .k{flex:none;font-size:19px;font-weight:700;color:var(--sub);letter-spacing:1px;margin-right:18px;}
.nextcls .v{flex:none;max-width:280px;font-size:32px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nextcls .t{min-width:0;font-size:22px;color:var(--sub);font-weight:500;margin-left:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nextcls .left{flex:none;margin-left:22px;height:52px;line-height:52px;padding:0 22px;border-radius:26px;font-size:23px;font-weight:800;background:var(--accentbg);color:var(--accent);}
.nextcls.soon .left{background:var(--warmbg);color:var(--warm);}
.nextcls.now .left{background:var(--red);color:#fff;-webkit-animation:glow 1s ease-in-out infinite;animation:glow 1s ease-in-out infinite;}

/* ── 수업 중 화면 ───────────────── */
body.classmode{background:#040507;}
body.classmode #bg{display:none;}
#classv{background:#040507;color:#8f99aa;}
.cv-school{position:absolute;left:80px;top:64px;font-size:28px;color:#4a5363;font-weight:600;}
.cv-date{position:absolute;right:80px;top:64px;font-size:28px;color:#4a5363;}
.cv-mid{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.cv-clock{font-size:280px;font-weight:800;color:#bcc4d1;letter-spacing:-8px;line-height:1;font-variant-numeric:tabular-nums;}
.cv-clock .colon{-webkit-animation:blink 2s steps(1) infinite;animation:blink 2s steps(1) infinite;}
.cv-now{font-size:50px;font-weight:600;margin-top:34px;color:#7d8798;}
.cv-now b{color:#d2d8e2;font-weight:800;}
.cv-bar{width:880px;height:8px;border-radius:4px;background:#141821;margin-top:40px;overflow:hidden;}
.cv-bar i{display:block;height:100%;width:0;background:#2f7f78;-webkit-transition:width 1s linear;transition:width 1s linear;}
.cv-left{font-size:28px;color:#566072;margin-top:18px;}
.cv-next{position:absolute;bottom:72px;left:0;right:0;text-align:center;font-size:32px;color:#566072;}
.cv-next b{color:#9aa4b5;font-weight:700;margin-left:12px;}
.right{display:flex;align-items:center;}
.weather{display:flex;align-items:center;padding-right:40px;margin-right:40px;border-right:1px solid var(--line);height:84px;}
.weather svg{width:64px;height:64px;margin-right:16px;-webkit-animation:bob 6s ease-in-out infinite;animation:bob 6s ease-in-out infinite;}
@-webkit-keyframes bob{50%{-webkit-transform:translateY(-5px)}}
@keyframes bob{50%{transform:translateY(-5px)}}
.w-temp{font-size:48px;font-weight:700;line-height:1;letter-spacing:-1px;}
.w-temp small{font-size:24px;color:var(--sub);font-weight:500;margin-left:2px;}
.w-sub{font-size:20px;color:var(--sub);margin-top:8px;white-space:nowrap;}
.w-sub b{color:var(--text);font-weight:700;}
.clock{font-size:108px;font-weight:300;line-height:1;letter-spacing:-4px;font-variant-numeric:tabular-nums;}
.clock .colon{-webkit-animation:blink 2s steps(1) infinite;animation:blink 2s steps(1) infinite;}
@-webkit-keyframes blink{50%{opacity:.25}}
@keyframes blink{50%{opacity:.25}}
@-webkit-keyframes glow{50%{opacity:.7}}
@keyframes glow{50%{opacity:.7}}
.clock .sec{font-size:32px;color:var(--dim);margin-left:12px;letter-spacing:0;font-weight:500;}

main{-webkit-flex:1;flex:1;display:flex;margin-top:40px;min-height:0;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:40px 44px;position:relative;overflow:hidden;box-shadow:var(--shadow);-webkit-transition:background-color 1.2s,border-color 1.2s;transition:background-color 1.2s,border-color 1.2s;}
.label{display:flex;align-items:center;font-size:21px;font-weight:700;color:var(--sub);letter-spacing:2px;white-space:nowrap;}
.label .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:14px;}
.label .tail{margin-left:auto;font-size:20px;font-weight:600;color:var(--dim);letter-spacing:0;font-variant-numeric:tabular-nums;}
.empty{font-size:28px;color:var(--sub);line-height:1.5;margin-top:28px;font-weight:600;}
.empty small{display:block;font-size:21px;color:var(--dim);margin-top:8px;font-weight:400;}
.muted{color:var(--sub);}

/* 급식 */
.meal{width:600px;display:flex;flex-direction:column;}
.noday{font-size:20px;color:var(--warm);font-weight:700;margin-top:14px;}
.menu{margin-top:14px;}
.menu li{font-size:42px;font-weight:700;letter-spacing:-1px;line-height:1.2;padding:13px 0;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.menu li:last-child{border-bottom:0;}
.menu.dense li{font-size:34px;padding:9px 0;}
.extra{margin-top:14px;font-size:22px;color:var(--sub);line-height:1.5;}
.extra b{color:var(--warm);font-weight:800;margin-right:10px;}
.nextline{margin-top:auto;padding:22px 26px;border-radius:20px;background:var(--surface2);}
.nextline b{display:block;font-size:19px;color:var(--sub);font-weight:700;letter-spacing:1px;margin-bottom:8px;}
.nextline span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:24px;line-height:1.5;color:var(--body);}

/* 공지 · 학사일정 */
.col{-webkit-flex:1;flex:1;display:flex;flex-direction:column;margin:0 28px;min-width:0;}
.notice{-webkit-flex:1;flex:1;display:flex;flex-direction:column;min-height:0;}
.n-wrap{-webkit-flex:1;flex:1;margin-top:26px;min-height:0;overflow:hidden;-webkit-transition:opacity .45s,-webkit-transform .45s;transition:opacity .45s,transform .45s;}
.n-wrap.out{opacity:0;-webkit-transform:translateY(-14px);transform:translateY(-14px);}
.chip{display:inline-block;font-size:19px;font-weight:700;padding:6px 12px;border-radius:8px;background:var(--accentbg);color:var(--accent);margin-right:8px;letter-spacing:.5px;}
.chip.hot{background:var(--redbg);color:var(--red);}
.n-title{font-size:46px;font-weight:800;line-height:1.28;margin-top:18px;letter-spacing:-1.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;}
.n-body{font-size:27px;line-height:1.6;color:var(--body);margin-top:16px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;max-height:176px;word-break:keep-all;}
.segs{display:flex;margin-top:18px;height:4px;}
.segs i{display:block;-webkit-flex:1;flex:1;height:4px;border-radius:2px;background:var(--line);margin-right:8px;overflow:hidden;}
.segs i:last-child{margin-right:0;}
.segs i.done{background:var(--accent);opacity:.35;}
.segs b{display:block;height:100%;width:0;background:var(--accent);}

.sched{-webkit-flex:none;flex:none;height:250px;margin-top:28px;padding:34px 40px;display:flex;flex-direction:column;}
.sched-body{-webkit-flex:1;flex:1;display:flex;align-items:center;margin-top:12px;min-height:0;}
.dd{flex:none;width:240px;padding-right:30px;margin-right:30px;border-right:1px solid var(--line);}
.dd:empty{display:none;}
.dd .dn{font-size:62px;font-weight:800;color:var(--warm);letter-spacing:-2px;line-height:1;}
.dd .dt{font-size:23px;font-weight:700;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dd .dd-date{font-size:18px;color:var(--sub);margin-top:4px;}
.sched-list{-webkit-flex:1;flex:1;min-width:0;}
.sched-list li{display:flex;align-items:center;font-size:24px;line-height:1.2;padding:10px 0;border-bottom:1px solid var(--line);}
.sched-list li:last-child{border-bottom:0;}
.sched-list .d{width:116px;flex:none;color:var(--sub);font-variant-numeric:tabular-nums;font-size:20px;}
.sched-list .n{-webkit-flex:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px;font-weight:600;}
.sched-list .r{flex:none;color:var(--dim);font-size:18px;font-weight:700;}

/* 숙제 */
.hw{width:440px;display:flex;flex-direction:column;}
.hw .dot{background:var(--hw);}
.hw-list{margin-top:8px;}
.hw-list li{padding:20px 0;border-bottom:1px solid var(--line);}
.hw-list li:last-child{border-bottom:0;}
.hw-list li.none{border:0;}
.hw-top{display:flex;align-items:center;min-width:0;}
.due{flex:none;font-size:17px;font-weight:800;padding:5px 10px;border-radius:7px;background:var(--surface2);color:var(--sub);margin-right:12px;}
.due.red{background:var(--redbg);color:var(--red);}
.due.warm{background:var(--warmbg);color:var(--warm);}
.subj{min-width:0;font-size:20px;font-weight:700;color:var(--hw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hw-t{font-size:28px;font-weight:700;line-height:1.35;margin-top:10px;letter-spacing:-.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;}
.hw-meta{font-size:19px;color:var(--sub);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

#foot{height:60px;display:flex;align-items:center;font-size:18px;color:var(--dim);}
.st{display:flex;align-items:center;margin-right:24px;}
.st:before{content:"";width:8px;height:8px;border-radius:4px;background:var(--dim);margin-right:8px;}
.st.ok:before{background:var(--accent);}
.st.err:before{background:var(--red);}
#updated{margin-left:auto;}
.music{display:none;align-items:center;margin-left:28px;color:var(--sub);}
.music.on{display:flex;}
.eq{display:flex;align-items:flex-end;height:18px;margin-right:10px;}
.eq i{display:block;width:4px;height:6px;margin-right:3px;border-radius:2px;background:var(--accent);}
.music.playing .eq i{-webkit-animation:eq .9s ease-in-out infinite alternate;animation:eq .9s ease-in-out infinite alternate;}
.music.playing .eq i:nth-child(2){-webkit-animation-delay:.3s;animation-delay:.3s;}
.music.playing .eq i:nth-child(3){-webkit-animation-delay:.6s;animation-delay:.6s;}
@-webkit-keyframes eq{from{height:4px}to{height:18px}}
@keyframes eq{from{height:4px}to{height:18px}}

/* ── 포스터 화면 ───────────────── */
#pview{overflow:hidden;background:#000;}
.pv-bg{position:absolute;left:-60px;top:-60px;width:2040px;height:1200px;background-position:center;background-size:cover;-webkit-filter:blur(40px) brightness(.55);filter:blur(40px) brightness(.55);}
.pv-img{position:absolute;left:60px;top:40px;width:1200px;height:1000px;display:flex;align-items:center;justify-content:center;}
.pv-img img{max-width:1200px;max-height:1000px;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.55);}
.kb{-webkit-animation:kb 14s ease-out both;animation:kb 14s ease-out both;}
@-webkit-keyframes kb{from{opacity:0;-webkit-transform:scale(.96)}12%{opacity:1}to{opacity:1;-webkit-transform:scale(1.02)}}
@keyframes kb{from{opacity:0;transform:scale(.96)}12%{opacity:1}to{opacity:1;transform:scale(1.02)}}
.pv-side{position:absolute;right:70px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center;color:#fff;}
.pv-side .school{color:#7ff0e4;}
.pv-side .clock{font-size:150px;margin-top:18px;}
.pv-side .pdate{font-size:40px;font-weight:700;margin-top:14px;opacity:.85;}
.pv-side .pcount{font-size:26px;margin-top:60px;opacity:.7;}
.pbar{margin-top:16px;height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;}
.pbar i{display:block;height:100%;width:0;background:#7ff0e4;}

#toast{position:fixed;left:50%;bottom:110px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:30px;padding:20px 34px;border-radius:18px;display:none;z-index:9;}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div id="stage">
  <div id="dash" class="view on">
    <header id="top">
      <div>
        <div class="school" id="schoolName">이우고등학교</div>
        <div class="date" id="date">&nbsp;</div>
      </div>
      <div class="mid"><div class="nextcls" id="nextCls"></div></div>
      <div class="right">
        <div class="weather" id="weather"></div>
        <div class="clock"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><span class="sec" id="sec">--</span></div>
      </div>
    </header>

    <main>
      <section class="card meal" id="mealMain"></section>
      <div class="col">
        <section class="card notice">
          <div class="label"><span class="dot"></span>공지사항<span class="tail" id="nCount"></span></div>
          <div class="n-wrap" id="nWrap"></div>
          <div class="segs" id="nSegs"></div>
        </section>
        <section class="card sched">
          <div class="label"><span class="dot" style="background:var(--warm)"></span>학사일정</div>
          <div class="sched-body"><div class="dd" id="dday"></div><ul class="sched-list" id="schedList"></ul></div>
        </section>
      </div>
      <section class="card hw">
        <div class="label"><span class="dot"></span>숙제<span class="tail" id="hwCount"></span></div>
        <ul class="hw-list" id="hwList"></ul>
      </section>
    </main>

    <footer id="foot">
      <span class="st" id="st-meal">급식</span>
      <span class="st" id="st-sched">학사일정</span>
      <span class="st" id="st-admin">관리</span>
      <span class="st" id="st-weather">날씨</span>
      <span id="updated"></span>
      <span class="music" id="music"><span class="eq"><i></i><i></i><i></i></span><span id="mName"></span></span>
    </footer>
  </div>

  <div id="classv" class="view">
    <div class="cv-school" id="cvSchool">이우고등학교</div>
    <div class="cv-date" id="cvDate"></div>
    <div class="cv-mid">
      <div class="cv-clock"><span id="cvH">--</span><span class="colon">:</span><span id="cvM">--</span></div>
      <div class="cv-now" id="cvNow"></div>
      <div class="cv-bar"><i id="cvBar"></i></div>
      <div class="cv-left" id="cvLeft"></div>
    </div>
    <div class="cv-next" id="cvNext"></div>
  </div>

  <div id="pview" class="view">
    <div class="pv-bg" id="pvBg"></div>
    <div class="pv-img"><img id="pvImg" alt=""></div>
    <div class="pv-side">
      <div class="school" id="pvSchool">이우고등학교</div>
      <div class="clock"><span id="hh2">--</span><span class="colon">:</span><span id="mm2">--</span></div>
      <div class="pdate" id="pvDate"></div>
      <div class="pcount" id="pvCount"></div>
      <div class="pbar"><i id="pvBar"></i></div>
    </div>
  </div>
</div>
<div id="toast">리모컨 가운데(OK) 버튼을 누르면 배경음악이 재생됩니다</div>

<script>
(function () {
  'use strict';

  /* ───────────── 설정 ───────────── */
  var CONFIG = {
    schoolName : '이우고등학교',
    eduCode    : 'J10',
    schoolCode : '7530587',

    if (!CONFIG.api && !DEMO) return [{ title: '관리자 앱을 연결해 주세요', body: '관리자 앱에서 공지를 올리면 이 자리에 자동으로 표시됩니다.', tag: '안내' }];
    return [{ title: '등록된 공지가 없습니다', body: '' }];
  }
  function renderNotice() {
    var list = noticeList();
    if (nIdx >= list.length) nIdx = 0;
    var it = list[nIdx];
    var chips = (it.hot ? '<span class="chip hot">중요</span>' : '') + (it.tag ? '<span class="chip">' + esc(it.tag) + '</span>' : '');
    var w = $('nWrap');
    w.innerHTML = '<div class="rise">' + (chips ? '<div>' + chips + '</div>' : '') +
      '<div class="n-title">' + esc(it.title) + '</div>' + (it.body ? '<div class="n-body">' + esc(it.body) + '</div>' : '') + '</div>';
    $('nCount').innerHTML = list.length > 1 ? (nIdx + 1) + ' / ' + list.length : '';
    var sg = '';
    if (list.length > 1) for (var i = 0; i < list.length && i < 12; i++) sg += '<i' + (i < nIdx ? ' class="done"' : '') + '>' + (i === nIdx ? '<b id="nBar"></b>' : '') + '</i>';
    $('nSegs').innerHTML = sg;
    if (list.length > 1 && $('nBar')) runBar($('nBar'), TIMING.notice);
    clearTimeout(nTimer);
    nTimer = setTimeout(nextNotice, TIMING.notice * 1000);
  }
  function nextNotice() {
    var list = noticeList();
    if (list.length < 2) { renderNotice(); return; }
    var w = $('nWrap');
    w.className = 'n-wrap out';
    setTimeout(function () { nIdx = (nIdx + 1) % list.length; w.className = 'n-wrap'; renderNotice(); }, 450);
  }

  /* 학사일정 · D-day */
  var FEATURE_RE = /고사|시험|평가|수능|축제|체육대회|방학|졸업|수학여행/;
  function renderSchedule() {
    var t = today0(), tk = ymd(t), i;
    var ev = STATE.events || [], dd = [], src = (ADMIN && ADMIN.ddays) || [];
    for (i = 0; i < src.length; i++) if (src[i].name && src[i].date) dd.push({ date: String(src[i].date).replace(/-/g, ''), name: src[i].name });
    dd.sort(byDate);
    var feat = null;
    for (i = 0; i < dd.length; i++) if (dd[i].date >= tk) { feat = dd[i]; break; }
    if (!feat) for (i = 0; i < ev.length; i++) if (ev[i].date >= tk && FEATURE_RE.test(ev[i].name)) { feat = ev[i]; break; }
    if (feat) {
      var fd = parseYmd(feat.date);
      $('dday').innerHTML = '<div class="dn">' + dLabel(diffDays(t, fd)) + '</div><div class="dt">' + esc(feat.name) + '</div><div class="dd-date">' + md(fd) + '</div>';
    } else $('dday').innerHTML = '';

    var all = ev.concat(dd), seen = {}, list = [];
    all.sort(byDate);
    for (i = 0; i < all.length && list.length < 3; i++) {
      var e = all[i];
      if (e.date < tk || seen[e.name]) continue;
      seen[e.name] = 1;
      if (feat && e.name === feat.name) continue;
      list.push(e);
    }
    var h = '';
    for (i = 0; i < list.length; i++) {
      var d = parseYmd(list[i].date), n = diffDays(t, d);
      h += '<li><span class="d">' + mdShort(d) + '</span><span class="n">' + esc(list[i].name) + '</span><span class="r">' + (n === 0 ? '오늘' : dLabel(n)) + '</span></li>';
    }
    if (!h) h = '<li><span class="n muted">' + (STATE.events ? '예정된 일정이 없습니다' : '일정을 불러오는 중입니다') + '</span></li>';
    $('schedList').innerHTML = h;
  }

  function renderUpdated() {
    if (!STATE.updated) return;
    $('updated').innerHTML = '최근 갱신 ' + hm(STATE.updated) + ' · 급식·학사일정 NEIS · 날씨 Open-Meteo';
  }
  function renderAll() { renderDate(); renderWeather(); renderMeals(); renderHomework(); renderSchedule(); renderUpdated(); }

  /* ───────────── 포스터 ───────────── */
  var IMG = {}, imgBusy = false, imgRetryAt = 0;
  function activePosters() {
    var t = iso(today0()), src = (ADMIN && ADMIN.posters) || [], out = [];
    for (var i = 0; i < src.length; i++) if (!src[i].end || src[i].end >= t) out.push(src[i]);
    return out;
  }
  function readyPosters() {
    var a = activePosters(), out = [];
    for (var i = 0; i < a.length; i++) if (IMG[a[i].id]) out.push(a[i]);
    return out;
  }
  function syncPosters() {
    var a = activePosters(), keep = {}, i;
    for (i = 0; i < a.length; i++) keep[a[i].id] = 1;
    for (var id in IMG) if (IMG.hasOwnProperty(id) && !keep[id]) delete IMG[id];
    fetchPoster();
  }
  function fetchPoster() {
    if (imgBusy || !CONFIG.api || new Date().getTime() < imgRetryAt) return;
    var a = activePosters();
    for (var i = 0; i < a.length; i++) {
      if (IMG[a[i].id]) continue;
      var id = a[i].id;
      imgBusy = true;
      jsonp(apiUrl('&img=' + encodeURIComponent(id)), 60000, function (d) {
        imgBusy = false;
        if (d && d.ok && d.data) IMG[id] = d.data; else imgRetryAt = new Date().getTime() + 60000;
        fetchPoster();
      }, function () { imgBusy = false; imgRetryAt = new Date().getTime() + 60000; });
      return;
    }
  }

  /* ───────────── 수업 시간 ───────────── */
  // 1-2반 기본 시간표 (관리자 앱 '시간표' 탭에서 바꾸면 그쪽이 우선)
  var DEFAULT_TT = {
    enabled: true,
    className: '1-2',
    periods: [
      { s: '09:10', e: '09:55' }, { s: '10:05', e: '10:50' },
      { s: '11:00', e: '11:45' }, { s: '11:55', e: '12:40' },
      { s: '14:00', e: '14:45' }, { s: '14:55', e: '15:40' },
      { s: '15:50', e: '16:35' }, { s: '16:45', e: '17:30' }
    ],
    days: [
      ['학급자치', '학급자치', '수학(이)', '수학(이)', '영어(김)', '영어(김)', '한국사(홍)', '한국사(홍)'],
      ['통사(우,구)', '한국사(우,구)', '국어(임)', '국어(임)', '통합과학(임)', '통합과학(임)', '기술가정(강)', '기술가정(강)'],
      ['영어(김)', '영어(김)', '수학(이)', '수학(이)', '', '', '', ''],
      ['기술가정(최)', '기술가정(최)', '진로/직업(김)', '진로/직업(김)', '국어(임)', '국어(윤)', '과탐실2(진)', '학년시간'],
      ['체육(조)', '체육(조)', '통합과학(진)', '통합과학(진)', '통합사회(정)', '통합사회(정)', '동아리', '동아리']
    ]
  };
  function TT() { var t = ADMIN && ADMIN.timetable; return (t && t.periods && t.days) ? t : DEFAULT_TT; }
  function toMin(s) { var a = String(s || '0:0').split(':'); return (+a[0]) * 60 + (+a[1] || 0); }
  var HOLIDAY_RE = /휴업|방학|공휴일|대체|개교기념|재량/;
  function noSchool(d) {
    var k = ymd(d), ev = STATE.events || [];
    for (var i = 0; i < ev.length; i++) if (ev[i].date === k && HOLIDAY_RE.test(ev[i].name)) return true;
    return false;
  }
  function classInfo(d) {
    var tt = TT(), dow = DOW !== null ? DOW : d.getDay(), r = { cur: null, next: null };
    if (tt.enabled === false || dow < 1 || dow > 5 || noSchool(d)) return r;
    var day = tt.days[dow - 1] || [], t = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
    for (var i = 0; i < tt.periods.length; i++) {
      var subj = trim(day[i]);
      if (!subj || !tt.periods[i]) continue;
      var s = toMin(tt.periods[i].s), e = toMin(tt.periods[i].e);
      var o = { i: i, subj: subj, s: s, e: e, start: tt.periods[i].s, end: tt.periods[i].e };
      if (t >= s && t < e) r.cur = o;
      else if (s > t && !r.next) r.next = o;
    }
    return r;
  }
  function durText(min) {
    min = Math.max(1, Math.ceil(min));
    return min >= 60 ? Math.floor(min / 60) + '시간' + (min % 60 ? ' ' + (min % 60) + '분' : '') : min + '분';
  }

  var inClass = false;
  function updateClass(d) {
    var ci = classInfo(d), c = !!ci.cur;
    if (c !== inClass) {
      inClass = c;
      document.body.className = c ? 'classmode' : '';
      if (c) { clearTimeout(cycleTimer); setView('class'); } else showDash();
      if (ADMIN) syncMusic();
    }
    var t = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60, tt = TT();
    var cls = tt.className ? esc(tt.className) + ' ' : '';

    if (c) {
      var cur = ci.cur;
      $('cvH').innerHTML = pad(d.getHours()); $('cvM').innerHTML = pad(d.getMinutes());
      $('cvNow').innerHTML = (cur.i + 1) + '교시 · <b>' + esc(cur.subj) + '</b>';
      $('cvBar').style.width = Math.min(100, (t - cur.s) / (cur.e - cur.s) * 100) + '%';
      $('cvLeft').innerHTML = cur.end + ' 종료 · ' + durText(cur.e - t) + ' 남음';
      $('cvNext').innerHTML = ci.next
        ? cls + '다음 수업<b>' + ci.next.start + ' ' + esc(ci.next.subj) + '</b>'
        : cls + '오늘 마지막 수업입니다';
    }

    var pill = $('nextCls');
    if (c || !ci.next) { pill.className = 'nextcls'; return; }
    var left = ci.next.s - t;
    pill.className = 'nextcls on' + (left <= 2 ? ' now' : left <= 10 ? ' soon' : '');
    pill.innerHTML = '<span class="k">다음 수업</span><span class="v">' + esc(ci.next.subj) + '</span>' +
      '<span class="t">' + (ci.next.i + 1) + '교시 · ' + ci.next.start + '</span>' +
      '<span class="left">' + (left <= 1 ? '곧 시작' : durText(left) + ' 후') + '</span>';
  }

  /* 대시보드 ↔ 포스터 순환 */
  var cycleTimer = null, posterPtr = 0;
  function setView(v) {
    $('dash').className = 'view' + (v === 'dash' ? ' on' : '');
    $('pview').className = 'view' + (v === 'poster' ? ' on' : '');
    $('classv').className = 'view' + (v === 'class' ? ' on' : '');
  }
  function showDash() {
    if (inClass) return;
    setView('dash');
    clearTimeout(cycleTimer);
    cycleTimer = setTimeout(function () { showPosters(0); }, TIMING.dash * 1000);
  }
  function showPosters(shown) {
    if (inClass) return;
    var ps = readyPosters();
    if (!ps.length || shown >= Math.min(TIMING.perCycle, ps.length)) { showDash(); return; }
    var p = ps[posterPtr % ps.length];
    posterPtr = (posterPtr + 1) % ps.length;
    var src = IMG[p.id];
    $('pvBg').style.backgroundImage = 'url("' + src + '")';
    $('pvImg').src = src;
    restartAnim($('pvImg'), 'kb');
    $('pvCount').innerHTML = '학교 소식 ' + ((posterPtr === 0 ? ps.length : posterPtr)) + ' / ' + ps.length;
    runBar($('pvBar'), TIMING.poster);
    setView('poster');
    clearTimeout(cycleTimer);
    cycleTimer = setTimeout(function () { showPosters(shown + 1); }, TIMING.poster * 1000);
  }

  /* ───────────── 배경음악 ───────────── */
  var audio = document.createElement('audio');
  audio.preload = 'auto';
  document.body.appendChild(audio);
  var MUSIC = { idx: 0, curId: null, blocked: false, loading: false, want: false };
  function tracks() { return (ADMIN && ADMIN.music && ADMIN.music.tracks) || []; }
  function inWindow() {
    var m = ADMIN && ADMIN.music;
    if (!m || !m.from || !m.to) return true;
    var now = hm(new Date());
    return m.from <= m.to ? (now >= m.from && now < m.to) : (now >= m.from || now < m.to);
  }
  function syncMusic() {
    var m = (ADMIN && ADMIN.music) || {}, list = tracks();
    audio.volume = Math.max(0, Math.min(1, (+m.volume || 0) / 100));
    MUSIC.want = !!m.enabled && list.length > 0 && inWindow() && !inClass && !DEMO && !!CONFIG.api;
    var chip = $('music');
    if (!MUSIC.want) {
      if (!audio.paused) audio.pause();
      chip.className = 'music';
      hideToast();
      return;
    }
    var exists = false;
    for (var i = 0; i < list.length; i++) if (list[i].id === MUSIC.curId) { exists = true; MUSIC.idx = i; }
    if (!exists) { playTrack(0); return; }
    if (audio.paused && audio.src) tryPlay();
  }
  function playTrack(i) {
    var list = tracks();
    if (!list.length || MUSIC.loading) return;
    var t = list[i % list.length];
    MUSIC.idx = i % list.length; MUSIC.curId = t.id; MUSIC.loading = true;
    jsonp(apiUrl('&file=' + encodeURIComponent(t.id)), 120000, function (d) {
      MUSIC.loading = false;
      if (MUSIC.curId !== t.id) return;
      if (d && d.ok && d.data) {
        audio.src = d.data;
        $('mName').innerHTML = esc(t.name);
        $('music').className = 'music on';
        if (MUSIC.want) tryPlay();
      } else MUSIC.curId = null;
    }, function () { MUSIC.loading = false; MUSIC.curId = null; });
  }
  function tryPlay() {
    var pr;
    try { pr = audio.play(); } catch (e) {}
    if (pr && pr.then) pr.then(function () { MUSIC.blocked = false; hideToast(); }, function () { MUSIC.blocked = true; showToast(); });
  }
  function showToast() { $('toast').style.display = 'block'; }
  function hideToast() { $('toast').style.display = 'none'; }
  audio.onplaying = function () { $('music').className = 'music on playing'; };
  audio.onpause = function () { $('music').className = audio.src && MUSIC.want ? 'music on' : 'music'; };
  audio.onended = function () {
    if (tracks().length <= 1) { audio.currentTime = 0; if (MUSIC.want) tryPlay(); }
    else { MUSIC.curId = null; playTrack(MUSIC.idx + 1); }
  };
  document.onkeydown = function () { if (MUSIC.want) tryPlay(); };
  document.onclick = function () { if (MUSIC.want) tryPlay(); };

  /* ───────────── 갱신 · 시계 · 화면 맞춤 ───────────── */
  function refresh() {
    if (DEMO) { demo(); renderAll(); return; }
    var pending = 3;
    function one() { renderAll(); if (--pending === 0) { STATE.updated = new Date(); renderUpdated(); } }
    loadMeals(one); loadSchedule(one); loadWeather(one);
  }

  var lastDay = '', lastMin = '';
  function tick() {
    var d = now(), h = pad(d.getHours()), m = pad(d.getMinutes());
    $('hh').innerHTML = h; $('mm').innerHTML = m; $('sec').innerHTML = pad(d.getSeconds());
    $('hh2').innerHTML = h; $('mm2').innerHTML = m;
    updateClass(d);
    var k = ymd(d);
    if (k !== lastDay) { lastDay = k; renderAll(); renderNotice(); if (STATE.updated) refresh(); }
    if (h + m !== lastMin) { lastMin = h + m; applyTheme(); if (ADMIN) syncMusic(); fetchPoster(); }
  }

  var shiftStep = 0, SHIFT = [[0, 0], [3, 0], [3, 3], [0, 3], [-3, 3], [-3, 0], [-3, -3], [0, -3], [3, -3]];
  function layout() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    var s = Math.min(w / 1920, h / 1080), o = SHIFT[shiftStep % SHIFT.length];
    var tr = 'translate(' + ((w - 1920 * s) / 2 + o[0] * s) + 'px,' + ((h - 1080 * s) / 2 + o[1] * s) + 'px) scale(' + s + ')';
    var st = $('stage').style;
    st.webkitTransform = tr; st.transform = tr;
  }

  /* ───────────── 미리보기 (?demo=1) ───────────── */
  function demoPoster(c1, c2, title, sub) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1131" height="1600" viewBox="0 0 1131 1600">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient></defs>' +
      '<rect width="1131" height="1600" fill="url(#g)"/><circle cx="900" cy="320" r="260" fill="#fff" fill-opacity=".15"/><circle cx="180" cy="1250" r="340" fill="#fff" fill-opacity=".1"/>' +
      '<text x="90" y="760" font-family="sans-serif" font-size="150" font-weight="800" fill="#fff">' + title + '</text>' +
      '<text x="96" y="880" font-family="sans-serif" font-size="64" fill="#fff" fill-opacity=".85">' + sub + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function demo() {
    var t = today0(), m = {}, i, d;
    var A = [['백미밥', '돼지고기김치찌개', '치즈닭갈비', '도토리묵무침', '배추김치', '요구르트'],
             ['흑미밥', '소고기미역국', '고등어구이', '감자채볶음', '깍두기', '청포도'],
             ['카레라이스', '팽이버섯된장국', '수제돈가스', '양배추샐러드', '배추김치', '초코우유']];
    for (i = 0, d = 0; i < 10; i++) {
      var day = addDays(t, i);
      if (day.getDay() === 0 || day.getDay() === 6) continue;
      m[ymd(day)] = { '중식': { items: A[d % A.length], kcal: (780 + d * 23) + ' Kcal' } };
      d++;
    }
    STATE.meals = m;
    STATE.events = [
      { date: ymd(addDays(t, 3)), name: '학생회 정기회의' },
      { date: ymd(addDays(t, 9)), name: '진로체험의 날' },
      { date: ymd(addDays(t, 17)), name: '2학기 2회고사' }
    ];
    STATE.weather = { t: 14.2, code: 2, day: 1, max: 18, min: 8, pop: 10 };
    STATE.updated = new Date();
    if (!ADMIN) {
      applyAdmin({
        version: 1, theme: 'auto', timing: { dash: +(qs('dash') || 30), poster: 10, perCycle: 1, notice: 12 },
        notices: [
          { id: 'a', title: '2학기 2회고사 시간표 안내', body: '시험 시간표가 학급 게시판에 게시되었습니다.\n시험 기간에는 도서관이 저녁 8시까지 운영됩니다.', tag: '학사', hot: true },
          { id: 'b', title: '학생회 건의함 운영', body: '급식·시설·행사 관련 건의는 1층 학생회실 앞 건의함에 넣어 주세요.', tag: '학생회' },
          { id: 'c', title: '분실물 보관 안내', body: '교무실 옆 분실물 보관함에서 찾아가세요.', tag: '생활' }
        ],
        ddays: [], posters: [{ id: 'p1' }, { id: 'p2' }], music: { enabled: false, tracks: [] },
        homework: [
          { id: 'h1', subject: '수학', title: '교과서 84~86쪽 연습문제', due: iso(t), target: '1학년 전체' },
          { id: 'h2', subject: '영어', title: 'Lesson 4 본문 암기', due: iso(addDays(t, 1)), target: '1-2반', note: '수업 시간 확인' },
          { id: 'h3', subject: '통합과학', title: '탐구 보고서 초안 제출', due: iso(addDays(t, 4)), target: '1학년 전체', note: '구글 클래스룸' },
          { id: 'h4', subject: '국어', title: '「운수 좋은 날」 감상문 A4 1장', due: iso(addDays(t, 6)) }
        ]
      });
      IMG.p1 = demoPoster('#ff7a59', '#ffb648', '이우 축제', '11월 25일 · 대강당');
      IMG.p2 = demoPoster('#5b6cff', '#4fd1c5', '독서 주간', '도서관 이벤트 진행 중');
    }
    setStatus('meal', true); setStatus('sched', true); setStatus('admin', true); setStatus('weather', true);
  }

  /* ───────────── 시작 ───────────── */
  $('schoolName').innerHTML = esc(CONFIG.schoolName);
  $('pvSchool').innerHTML = esc(CONFIG.schoolName);
  $('cvSchool').innerHTML = esc(CONFIG.schoolName);
  STATE.meals = load('meals'); STATE.events = load('events'); STATE.weather = load('weather');
  applyTheme();
  layout();
  window.onresize = layout;
  tick();
  refresh();
  if (!DEMO) loadAdmin();
  renderNotice();
  showDash();
  if (qs('view') === 'poster') showPosters(0);

  setInterval(tick, 1000);
  setInterval(refresh, CONFIG.refreshMinutes * 60000);
  setInterval(function () { if (!DEMO) loadAdmin(); }, CONFIG.apiSeconds * 1000);
  setInterval(nextHomeworkPage, 15000);
  setInterval(function () { shiftStep++; layout(); }, 5 * 60000);
  setInterval(function () { if (navigator.onLine !== false) location.reload(); }, CONFIG.reloadHours * 3600000);
})();
</script>
</body>
