<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이우고 TV 대시보드</title>
<!--
  ┌──────────────────────────────────────────────────────────────┐
  │  이우고등학교 TV 대시보드                                      │
  │  대상: 삼성 UN65NU7100 (2018년형 · Tizen 4.0 · Chromium 56)    │
  │                                                              │
  │  호환 원칙                                                    │
  │   - 자바스크립트는 ES5 문법만 사용 (화살표 함수, let/const,     │
  │     템플릿 문자열 없음)                                         │
  │   - 레이아웃은 flexbox만 사용 (CSS grid, flex gap 미지원)       │
  │   - 통신은 XMLHttpRequest + 시간 제한, 시트는 JSONP            │
  │   - 마지막으로 받은 데이터는 localStorage에 보관해 인터넷이      │
  │     잠깐 끊겨도 화면이 비지 않게 함                             │
  │                                                              │
  │  설정은 아래 CONFIG 또는 주소 뒤 파라미터로 바꿀 수 있습니다.     │
  │   예) tv-dashboard.html?proxy=https://xxx.workers.dev&sheet=시트ID │
  │   미리보기) tv-dashboard.html?demo=1                           │
  └──────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#0a111d; --card:#111a2a; --card2:#162238; --line:#22304a;
  --text:#eef3fb; --sub:#8fa0bb; --dim:#5d6d88;
  --accent:#4fd1c5; --warm:#ffb648; --red:#ff6b6b; --blue:#6ea8ff;
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a111d;background:var(--bg);color:#eef3fb;color:var(--text);cursor:none;}
body{font-family:"Pretendard","Samsung One Korean","SamsungOneKorean","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}
ul{list-style:none;margin:0;padding:0;}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;-webkit-transform-origin:0 0;transform-origin:0 0;padding:40px 56px 0;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;}

/* ── 상단 ───────────────────────── */
#top{height:150px;display:flex;-webkit-box-align:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;}
.school{font-size:28px;font-weight:600;color:var(--accent);letter-spacing:1px;}
.date{font-size:60px;font-weight:700;margin-top:6px;letter-spacing:-1px;}
.date .dow{color:var(--sub);font-weight:500;margin-left:14px;}
.right{display:flex;align-items:center;}
.weather{display:flex;align-items:center;padding-right:44px;margin-right:44px;border-right:2px solid var(--line);min-height:96px;}
.weather svg{width:84px;height:84px;margin-right:18px;}
.w-temp{font-size:64px;font-weight:700;line-height:1;letter-spacing:-1px;}
.w-temp small{font-size:30px;color:var(--sub);font-weight:500;margin-left:2px;}
.w-sub{font-size:24px;color:var(--sub);margin-top:10px;white-space:nowrap;}
.w-sub b{color:var(--text);font-weight:600;}
.clock{font-size:120px;font-weight:700;line-height:1;letter-spacing:-3px;font-variant-numeric:tabular-nums;}
.clock .sec{font-size:44px;color:var(--dim);margin-left:10px;letter-spacing:0;}

/* ── 본문 ───────────────────────── */
main{-webkit-box-flex:1;-webkit-flex:1;flex:1;display:flex;margin-top:26px;min-height:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:34px 40px;position:relative;overflow:hidden;}
.label{display:flex;align-items:center;font-size:30px;font-weight:700;color:var(--sub);}
.label .dot{width:14px;height:14px;border-radius:7px;background:var(--accent);margin-right:14px;}
.label .tail{margin-left:auto;font-size:24px;font-weight:500;color:var(--dim);}

/* 급식 */
.meal{width:1060px;display:flex;padding:0;}
.meal-main{-webkit-flex:1;flex:1;padding:36px 44px;}
.meal-next{width:380px;background:var(--card2);border-left:1px solid var(--line);padding:36px 36px;}
.meal-head{font-size:46px;font-weight:700;margin:18px 0 26px;letter-spacing:-1px;}
.meal-head .kcal{font-size:26px;color:var(--sub);font-weight:500;margin-left:14px;letter-spacing:0;}
.menu li{font-size:50px;line-height:1.5;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.menu li:first-child{color:var(--accent);}
.menu.dense li{font-size:40px;line-height:1.4;}
.menu.small li{font-size:30px;line-height:1.55;color:#c9d4e6;font-weight:400;}
.menu.small li:first-child{color:#c9d4e6;}
.next-date{font-size:34px;font-weight:700;margin:18px 0 18px;}
.extra{margin-top:24px;padding-top:20px;border-top:1px dashed var(--line);font-size:28px;color:var(--sub);line-height:1.5;}
.extra b{color:var(--warm);font-weight:600;margin-right:10px;}
.empty{font-size:34px;color:var(--sub);line-height:1.5;margin-top:24px;}
.empty small{display:block;font-size:24px;color:var(--dim);margin-top:10px;}

/* 오른쪽 열 */
.col{-webkit-flex:1;flex:1;display:flex;flex-direction:column;margin-left:26px;min-width:0;}
.notice{-webkit-flex:none;flex:none;height:420px;display:flex;flex-direction:column;}
.sched{-webkit-flex:1;flex:1;margin-top:26px;}

.n-wrap{-webkit-flex:1;flex:1;margin-top:22px;opacity:1;-webkit-transition:opacity .45s;transition:opacity .45s;min-height:0;overflow:hidden;}
.n-wrap.fade{opacity:0;}
.chip{display:inline-block;font-size:22px;font-weight:600;padding:6px 16px;border-radius:999px;background:rgba(79,209,197,.14);color:var(--accent);margin-right:10px;}
.chip.hot{background:rgba(255,107,107,.16);color:var(--red);}
.n-title{font-size:44px;font-weight:700;line-height:1.3;margin-top:16px;letter-spacing:-1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.n-body{font-size:30px;line-height:1.55;color:#c3cee0;margin-top:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;max-height:140px;}
.dots{display:flex;margin-top:14px;}
.dots i{display:block;width:12px;height:12px;border-radius:6px;background:var(--line);margin-right:10px;}
.dots i.on{background:var(--accent);width:34px;}

.dday{display:flex;align-items:center;margin-top:18px;padding:12px 24px;border-radius:20px;background:rgba(255,182,72,.10);border:1px solid rgba(255,182,72,.28);}
.dday .dn{font-size:52px;font-weight:800;color:var(--warm);letter-spacing:-1px;min-width:170px;}
.dday .dt{font-size:30px;font-weight:600;line-height:1.3;}
.dday .dt small{display:block;font-size:22px;color:var(--sub);font-weight:400;margin-top:4px;}
.sched-list{margin-top:14px;}
.sched-list li{display:flex;align-items:center;font-size:28px;line-height:1;padding:12px 4px;border-bottom:1px solid var(--line);}
.sched-list li:last-child{border-bottom:0;}
.sched-list .d{width:150px;color:var(--sub);font-variant-numeric:tabular-nums;}
.sched-list .n{-webkit-flex:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px;}
.sched-list .r{color:var(--dim);font-size:24px;}

/* ── 하단 ───────────────────────── */
#foot{height:64px;display:flex;align-items:center;font-size:20px;color:var(--dim);}
.st{display:flex;align-items:center;margin-right:26px;}
.st:before{content:"";width:10px;height:10px;border-radius:5px;background:var(--dim);margin-right:8px;}
.st.ok:before{background:var(--accent);}
.st.err:before{background:var(--red);}
#updated{margin-left:auto;}
</style>
</head>
<body>
<div id="stage">
  <header id="top">
    <div>
      <div class="school" id="schoolName">이우고등학교</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <div class="right">
      <div class="weather" id="weather"></div>
      <div class="clock"><span id="hm">--:--</span><span class="sec" id="sec">--</span></div>
    </div>
  </header>

  <main>
    <section class="card meal">
      <div class="meal-main" id="mealMain"></div>
      <div class="meal-next" id="mealNext"></div>
    </section>

    <div class="col">
      <section class="card notice">
        <div class="label"><span class="dot"></span>공지사항<span class="tail" id="nCount"></span></div>
        <div class="n-wrap" id="nWrap"></div>
        <div class="dots" id="nDots"></div>
      </section>
      <section class="card sched">
        <div class="label"><span class="dot" style="background:#ffb648"></span>학사일정</div>
        <div id="dday"></div>
        <ul class="sched-list" id="schedList"></ul>
      </section>
    </div>
  </main>

  <footer id="foot">
    <span class="st" id="st-meal">급식</span>
    <span class="st" id="st-sched">학사일정</span>
    <span class="st" id="st-notice">공지</span>
    <span class="st" id="st-weather">날씨</span>
    <span id="updated"></span>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* ───────────── 설정 ───────────── */
  var CONFIG = {
    schoolName : '이우고등학교',
    eduCode    : 'J10',        // 경기도교육청
    schoolCode : '7530587',    // 이우고등학교 (NEIS 학교정보 기준)
    neisProxy  : '',           // 급식 디스플레이에서 쓰던 Cloudflare Worker 주소 (예: https://neis-proxy.xxx.workers.dev)
    neisKey    : '',           // 프록시가 없을 때만 사용. 페이지 소스에 공개되니 가급적 프록시를 쓰세요.
    sheetId    : '',           // 공지·D-day 구글 시트 ID (주소의 /d/ 와 /edit 사이 문자열)
    noticeTab  : '공지',
    ddayTab    : '디데이',
    lat        : 37.378,       // 성남시 분당구 동원동 부근
    lon        : 127.095,
    noticeSeconds  : 12,       // 공지 한 건당 표시 시간(초)
    refreshMinutes : 15,       // 데이터 새로고침 간격(분)
    reloadHours    : 6         // 페이지 전체 새로고침 간격(시간) — 코드 수정 반영·메모리 정리
  };

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }
  var p;
  if ((p = qs('proxy'))) CONFIG.neisProxy = p;
  if ((p = qs('key')))   CONFIG.neisKey = p;
  if ((p = qs('sheet'))) CONFIG.sheetId = p;
  var DEMO = qs('demo') === '1';

  /* ───────────── 유틸 ───────────── */
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function parseYmd(s) { return new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function today0() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function diffDays(a, b) { return Math.round((b.getTime() - a.getTime()) / 86400000); }
  function trim(s) { return String(s == null ? '' : s).replace(/^\s+|\s+$/g, ''); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&quot;';
    });
  }
  function md(d) { return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')'; }
  function mdShort(d) { return pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' (' + DAYS[d.getDay()] + ')'; }
  function dLabel(n) { return n === 0 ? 'D-DAY' : (n > 0 ? 'D-' + n : 'D+' + (-n)); }
  function keys(o) { var a = []; for (var k in o) if (o.hasOwnProperty(k)) a.push(k); return a; }

  function save(k, v) { try { localStorage.setItem('tvdash:' + k, JSON.stringify(v)); } catch (e) {} }
  function load(k) { try { var r = localStorage.getItem('tvdash:' + k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

  /* ───────────── 통신 ───────────── */
  function getJSON(url, timeout, ok, fail) {
    var done = false, x;
    try { x = new XMLHttpRequest(); x.open('GET', url, true); } catch (e) { fail(e); return; }
    var t = setTimeout(function () {
      if (done) return; done = true;
      try { x.abort(); } catch (e) {}
      fail(new Error('timeout'));
    }, timeout || 8000);
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || done) return;
      done = true; clearTimeout(t);
      if (x.status >= 200 && x.status < 300) {
        var j;
        try { j = JSON.parse(x.responseText); } catch (e) { fail(e); return; }
        ok(j);
      } else {
        fail(new Error('HTTP ' + x.status));
      }
    };
    try { x.send(); } catch (e) { if (!done) { done = true; clearTimeout(t); fail(e); } }
  }

  // 주소 목록을 차례로 시도. check(j)가 false면 다음 주소로 넘어감
  function getFirst(urls, check, ok, fail) {
    var i = 0;
    function next(err) {
      if (i >= urls.length) { fail(err); return; }
      var u = urls[i++];
      getJSON(u, 8000, function (j) {
        if (check && !check(j)) { next(new Error('bad response')); return; }
        ok(j);
      }, next);
    }
    next();
  }

  var jsonpN = 0;
  function jsonp(url, timeout, ok, fail) {
    var name = '__tvcb' + (++jsonpN) + '_' + new Date().getTime();
    var s = document.createElement('script'), done = false;
    function cleanup() {
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    var t = setTimeout(function () {
      if (done) return; done = true; cleanup(); fail(new Error('timeout'));
    }, timeout || 10000);
    window[name] = function (data) {
      if (done) return; done = true; clearTimeout(t); cleanup(); ok(data);
    };
    s.onerror = function () {
      if (done) return; done = true; clearTimeout(t); cleanup(); fail(new Error('load error'));
    };
    s.src = url.replace('{cb}', name);
    (document.head || document.getElementsByTagName('head')[0]).appendChild(s);
  }

  /* ───────────── 상태 ───────────── */
  var STATE = {
    meals: null,      // { 'YYYYMMDD': { '중식': {items:[], kcal:''}, ... } }
    events: null,     // [ {date:'YYYYMMDD', name:''} ]
    notices: null,    // [ {title, body, tag, hot} ]
    ddays: null,      // [ {date:'YYYYMMDD', name:''} ]
    weather: null,
    updated: null
  };
  function setStatus(id, ok) {
    var el = $('st-' + id);
    if (el) el.className = 'st ' + (ok ? 'ok' : 'err');
  }

  /* ───────────── NEIS (급식·학사일정) ───────────── */
  function neisUrls(service, params) {
    var q = [];
    for (var k in params) if (params.hasOwnProperty(k)) q.push(k + '=' + encodeURIComponent(params[k]));
    q.push('Type=json');
    var query = q.join('&'), urls = [];
    if (CONFIG.neisProxy) urls.push(CONFIG.neisProxy.replace(/\/+$/, '') + '/' + service + '?' + query);
    urls.push('https://open.neis.go.kr/hub/' + service + '?' + query +
      (CONFIG.neisKey ? '&KEY=' + encodeURIComponent(CONFIG.neisKey) : ''));
    return urls;
  }
  // 정상 응답: { service: [ {head}, {row:[...]} ] }  /  자료 없음: { RESULT: { CODE:'INFO-200' } }
  function neisOk(service) {
    return function (j) {
      if (!j) return false;
      if (j[service]) return true;
      return !!(j.RESULT && j.RESULT.CODE === 'INFO-200');
    };
  }
  function neisRows(j, service) {
    var a = j && j[service];
    if (!a) return [];
    for (var i = 0; i < a.length; i++) if (a[i].row) return a[i].row;
    return [];
  }

  // "통새우왕만두 (1.5.6)" / "통새우왕만두21.5.6." → "통새우왕만두" / "통새우왕만두2"
  function cleanDish(s) {
    s = trim(s).replace(/\s*\([\d\.\s,]*\)\s*$/, '');
    var m = /((?:\d{1,2}\.)+)$/.exec(s);
    if (m) {
      var cut = m[1], first = cut.split('.')[0];
      if (first.length === 2 && +first > 19) cut = cut.slice(1);
      s = s.slice(0, s.length - cut.length);
    }
    return trim(s.replace(/[\*#]+$/, '').replace(/\s+/g, ' '));
  }
  function splitMenu(html) {
    var parts = String(html || '').split(/<br\s*\/?>/i), out = [];
    for (var i = 0; i < parts.length; i++) { var c = cleanDish(parts[i]); if (c) out.push(c); }
    return out;
  }

  function loadMeals(cb) {
    var t = today0();
    var params = {
      ATPT_OFCDC_SC_CODE: CONFIG.eduCode, SD_SCHUL_CODE: CONFIG.schoolCode,
      MLSV_FROM_YMD: ymd(t), MLSV_TO_YMD: ymd(addDays(t, 14)), pIndex: 1, pSize: 100
    };
    getFirst(neisUrls('mealServiceDietInfo', params), neisOk('mealServiceDietInfo'), function (j) {
      var rows = neisRows(j, 'mealServiceDietInfo'), m = {};
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i], d = r.MLSV_YMD;
        if (!m[d]) m[d] = {};
        m[d][r.MMEAL_SC_NM] = { items: splitMenu(r.DDISH_NM), kcal: r.CAL_INFO || '' };
      }
      STATE.meals = m; save('meals', m); setStatus('meal', true); cb();
    }, function () {
      if (!STATE.meals) STATE.meals = load('meals');
      setStatus('meal', false); cb();
    });
  }

  function loadSchedule(cb) {
    var t = today0();
    var params = {
      ATPT_OFCDC_SC_CODE: CONFIG.eduCode, SD_SCHUL_CODE: CONFIG.schoolCode,
      AA_FROM_YMD: ymd(t), AA_TO_YMD: ymd(addDays(t, 120)), pIndex: 1, pSize: 200
    };
    getFirst(neisUrls('SchoolSchedule', params), neisOk('SchoolSchedule'), function (j) {
      var rows = neisRows(j, 'SchoolSchedule'), out = [];
      for (var i = 0; i < rows.length; i++) {
        var n = trim(rows[i].EVENT_NM);
        if (!n || n === '토요휴업일') continue;
        out.push({ date: rows[i].AA_YMD, name: n });
      }
      out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      STATE.events = out; save('events', out); setStatus('sched', true); cb();
    }, function () {
      if (!STATE.events) STATE.events = load('events');
      setStatus('sched', false); cb();
    });
  }

  /* ───────────── 구글 시트 (공지·D-day) ───────────── */
  function sheetUrl(tab) {
    return 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(CONFIG.sheetId) +
      '/gviz/tq?tqx=out:json;responseHandler:{cb}&headers=1&sheet=' + encodeURIComponent(tab) +
      '&_=' + new Date().getTime();
  }
  function gvizRows(data) {
    if (!data || data.status === 'error' || !data.table) return null;
    var cols = data.table.cols || [], rows = data.table.rows || [], out = [];
    for (var i = 0; i < rows.length; i++) {
      var c = rows[i].c || [], o = {}, any = false;
      for (var j = 0; j < cols.length; j++) {
        var label = trim(cols[j].label || cols[j].id), cell = c[j];
        var v = cell ? cell.v : null, f = cell ? cell.f : null;
        o[label] = { v: v, f: f };
        if (v !== null && v !== undefined && v !== '') any = true;
      }
      if (any) out.push(o);
    }
    return out;
  }
  function cellText(o, key) {
    var c = o[key];
    if (!c || c.v === null || c.v === undefined) return '';
    if (typeof c.v === 'string') return trim(c.v);
    return trim(c.f !== null && c.f !== undefined ? c.f : c.v);
  }
  function cellDate(o, key) {
    var c = o[key];
    if (!c || c.v === null || c.v === undefined || c.v === '') return null;
    var v = String(c.v), m = /^Date\((\d+),(\d+),(\d+)/.exec(v);
    if (m) return new Date(+m[1], +m[2], +m[3]);
    m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(v);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    return null;
  }
  function yes(s) { s = trim(s).toUpperCase(); return s === 'O' || s === 'Y' || s === 'TRUE' || s === '중요' || s === 'V'; }

  function loadNotices(cb) {
    if (!CONFIG.sheetId) { setStatus('notice', false); cb(); return; }
    jsonp(sheetUrl(CONFIG.noticeTab), 10000, function (data) {
      var rows = gvizRows(data);
      if (!rows) { fallback(); return; }
      var t = today0(), out = [];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i], title = cellText(r, '제목');
        if (!title) continue;
        var s = cellDate(r, '게시시작'), e = cellDate(r, '게시종료');
        if (s && t < s) continue;
        if (e && t > e) continue;
        out.push({ title: title, body: cellText(r, '내용'), tag: cellText(r, '분류'), hot: yes(cellText(r, '중요')) });
      }
      out.sort(function (a, b) { return (b.hot ? 1 : 0) - (a.hot ? 1 : 0); });
      STATE.notices = out; save('notices', out); setStatus('notice', true); cb();
    }, fallback);
    function fallback() {
      if (!STATE.notices) STATE.notices = load('notices');
      setStatus('notice', false); cb();
    }
  }

  function loadDdays(cb) {
    if (!CONFIG.sheetId) { cb(); return; }
    jsonp(sheetUrl(CONFIG.ddayTab), 10000, function (data) {
      var rows = gvizRows(data) || [], out = [];
      for (var i = 0; i < rows.length; i++) {
        var n = cellText(rows[i], '이름'), d = cellDate(rows[i], '날짜');
        if (n && d) out.push({ date: ymd(d), name: n });
      }
      out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      STATE.ddays = out; save('ddays', out); cb();
    }, function () {
      if (!STATE.ddays) STATE.ddays = load('ddays');
      cb();
    });
  }

  /* ───────────── 날씨 (Open-Meteo, 키 불필요) ───────────── */
  function loadWeather(cb) {
    var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
      '&current=temperature_2m,apparent_temperature,weather_code,is_day' +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=Asia%2FSeoul&forecast_days=1';
    getJSON(u, 8000, function (j) {
      if (!j || !j.current || !j.daily) { fail(); return; }
      STATE.weather = {
        t: j.current.temperature_2m, feel: j.current.apparent_temperature,
        code: j.current.weather_code, day: j.current.is_day,
        max: j.daily.temperature_2m_max[0], min: j.daily.temperature_2m_min[0],
        pop: j.daily.precipitation_probability_max[0]
      };
      save('weather', STATE.weather); setStatus('weather', true); cb();
    }, fail);
    function fail() {
      if (!STATE.weather) STATE.weather = load('weather');
      setStatus('weather', false); cb();
    }
  }

  /* ───────────── 날씨 아이콘 ───────────── */
  var SUN = '<circle cx="32" cy="32" r="11" fill="#ffc94a"/><g stroke="#ffc94a" stroke-width="4" stroke-linecap="round"><path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/></g>';
  var MOON = '<path d="M40 10a22 22 0 1 0 14 34A18 18 0 0 1 40 10z" fill="#ffe08a"/>';
  var CLOUD = '<path d="M20 50h26a11 11 0 0 0 1-22 15 15 0 0 0-29 4 9 9 0 0 0 2 18z" fill="#c9d4e6"/>';
  var CLOUD_S = '<path d="M26 52h22a9 9 0 0 0 1-18 12 12 0 0 0-23 3 7.5 7.5 0 0 0 0 15z" fill="#c9d4e6"/>';
  var ICONS = {
    clear: SUN,
    night: MOON,
    partly: '<g transform="translate(-8 -8) scale(.8)">' + SUN + '</g>' + CLOUD_S,
    cloud: CLOUD,
    fog: CLOUD + '<g stroke="#8fa0bb" stroke-width="4" stroke-linecap="round"><path d="M14 57h36M20 62h26"/></g>',
    rain: '<g transform="translate(0 -6)">' + CLOUD + '</g><g stroke="#6ea8ff" stroke-width="4" stroke-linecap="round"><path d="M24 50l-3 8M34 50l-3 8M44 50l-3 8"/></g>',
    snow: '<g transform="translate(0 -6)">' + CLOUD + '</g><g fill="#ffffff"><circle cx="22" cy="54" r="3"/><circle cx="33" cy="58" r="3"/><circle cx="44" cy="54" r="3"/></g>',
    storm: '<g transform="translate(0 -6)">' + CLOUD + '</g><path d="M34 46l-8 12h7l-4 8 11-13h-7l4-7z" fill="#ffc94a"/>'
  };
  function wxInfo(code, isDay) {
    if (code === 0) return { k: isDay ? 'clear' : 'night', t: '맑음' };
    if (code === 1) return { k: isDay ? 'clear' : 'night', t: '대체로 맑음' };
    if (code === 2) return { k: 'partly', t: '구름 조금' };
    if (code === 3) return { k: 'cloud', t: '흐림' };
    if (code === 45 || code === 48) return { k: 'fog', t: '안개' };
    if (code >= 51 && code <= 57) return { k: 'rain', t: '이슬비' };
    if (code >= 61 && code <= 67) return { k: 'rain', t: '비' };
    if (code >= 71 && code <= 77) return { k: 'snow', t: '눈' };
    if (code >= 80 && code <= 82) return { k: 'rain', t: '소나기' };
    if (code === 85 || code === 86) return { k: 'snow', t: '눈' };
    if (code >= 95) return { k: 'storm', t: '뇌우' };
    return { k: 'cloud', t: '-' };
  }

  /* ───────────── 그리기 ───────────── */
  function renderDate() {
    var d = new Date();
    $('date').innerHTML = (d.getMonth() + 1) + '월 ' + d.getDate() + '일<span class="dow">' + DAYS[d.getDay()] + '요일</span>';
  }

  function renderWeather() {
    var w = STATE.weather;
    if (!w) { $('weather').innerHTML = '<div class="w-sub">날씨 정보를 불러오는 중</div>'; return; }
    var info = wxInfo(w.code, w.day);
    $('weather').innerHTML =
      '<svg viewBox="0 0 64 64">' + ICONS[info.k] + '</svg>' +
      '<div><div class="w-temp">' + Math.round(w.t) + '<small>°C</small></div>' +
      '<div class="w-sub">' + info.t + ' · <b>' + Math.round(w.max) + '°</b> / ' + Math.round(w.min) + '° · 강수 ' +
      (w.pop == null ? '-' : w.pop + '%') + '</div></div>';
  }

  function pickMeal(day) {
    if (!day) return null;
    if (day['중식']) return { name: '중식', m: day['중식'] };
    if (day['석식']) return { name: '석식', m: day['석식'] };
    if (day['조식']) return { name: '조식', m: day['조식'] };
    return null;
  }
  function menuHtml(items, cls) {
    var h = '<ul class="menu' + (cls ? ' ' + cls : '') + '">';
    for (var i = 0; i < items.length; i++) h += '<li>' + esc(items[i]) + '</li>';
    return h + '</ul>';
  }

  function renderMeals() {
    var main = $('mealMain'), side = $('mealNext');
    var m = STATE.meals;
    var tk = ymd(today0());
    var label = '<div class="label"><span class="dot"></span>급식</div>';

    if (!m) {
      main.innerHTML = label + '<div class="empty">급식 정보를 불러오는 중입니다<small>잠시 후 자동으로 다시 시도합니다</small></div>';
      side.innerHTML = '';
      return;
    }
    var future = keys(m).sort(), upcoming = [];
    for (var i = 0; i < future.length; i++) if (future[i] > tk && pickMeal(m[future[i]])) upcoming.push(future[i]);

    var today = pickMeal(m[tk]), first, firstKey, rest;
    if (today) { first = today; firstKey = tk; rest = upcoming; }
    else if (upcoming.length) { firstKey = upcoming[0]; first = pickMeal(m[firstKey]); rest = upcoming.slice(1); }

    if (!first) {
      main.innerHTML = label + '<div class="meal-head">오늘의 급식</div><div class="empty">예정된 급식이 없습니다<small>주말·방학이거나 아직 식단이 등록되지 않았습니다</small></div>';
      side.innerHTML = '';
      return;
    }

    var isToday = firstKey === tk;
    var kcal = first.m.kcal ? '<span class="kcal">' + esc(first.m.kcal) + '</span>' : '';
    var head = isToday ? '오늘 ' + first.name : md(parseYmd(firstKey)) + ' ' + first.name;
    var h = label + '<div class="meal-head">' + head + kcal + '</div>' + menuHtml(first.m.items, first.m.items.length > 7 ? 'dense' : '');

    // 같은 날 석식이 따로 있으면 아래에 한 줄로
    var dayObj = m[firstKey];
    if (first.name === '중식' && dayObj['석식']) {
      h += '<div class="extra"><b>석식</b>' + esc(dayObj['석식'].items.join(' · ')) + '</div>';
    }
    if (!isToday) h = h.replace('<div class="meal-head">', '<div class="meal-head" style="color:#8fa0bb;font-size:24px;margin:16px 0 0">오늘은 급식이 없습니다</div><div class="meal-head">');
    main.innerHTML = h;

    if (rest.length) {
      var nk = rest[0], nx = pickMeal(m[nk]);
      side.innerHTML = '<div class="label">다음 급식</div><div class="next-date">' + md(parseYmd(nk)) + '</div>' + menuHtml(nx.m.items, 'small');
    } else {
      side.innerHTML = '<div class="label">다음 급식</div><div class="empty" style="font-size:28px">아직 등록된 식단이 없습니다</div>';
    }
  }

  var nIdx = 0;
  function noticeList() {
    var n = STATE.notices;
    if (n && n.length) return n;
    if (!CONFIG.sheetId && !DEMO) return [{ title: '공지 시트를 연결해 주세요', body: '구글 시트의 \'' + CONFIG.noticeTab + '\' 탭에 제목·내용을 입력하면 이 자리에 자동으로 표시됩니다.', tag: '안내', hot: false }];
    return [{ title: '등록된 공지가 없습니다', body: '', tag: '', hot: false }];
  }
  function renderNotice() {
    var list = noticeList();
    if (nIdx >= list.length) nIdx = 0;
    var it = list[nIdx];
    var chips = (it.hot ? '<span class="chip hot">중요</span>' : '') + (it.tag ? '<span class="chip">' + esc(it.tag) + '</span>' : '');
    $('nWrap').innerHTML = (chips ? '<div>' + chips + '</div>' : '') +
      '<div class="n-title">' + esc(it.title) + '</div>' +
      (it.body ? '<div class="n-body">' + esc(it.body) + '</div>' : '');
    $('nCount').innerHTML = list.length > 1 ? (nIdx + 1) + ' / ' + list.length : '';
    var d = '';
    if (list.length > 1) for (var i = 0; i < list.length && i < 12; i++) d += '<i' + (i === nIdx ? ' class="on"' : '') + '></i>';
    $('nDots').innerHTML = d;
  }
  function rotateNotice() {
    var list = noticeList();
    if (list.length < 2) { renderNotice(); return; }
    var w = $('nWrap');
    w.className = 'n-wrap fade';
    setTimeout(function () {
      nIdx = (nIdx + 1) % list.length;
      renderNotice();
      w.className = 'n-wrap';
    }, 460);
  }

  var FEATURE_RE = /고사|시험|평가|수능|축제|체육대회|방학|졸업|수학여행/;
  function renderSchedule() {
    var t = today0(), tk = ymd(t);
    var ev = STATE.events || [], dd = STATE.ddays || [];
    var feat = null, i;

    for (i = 0; i < dd.length; i++) if (dd[i].date >= tk) { feat = dd[i]; break; }
    if (!feat) for (i = 0; i < ev.length; i++) if (ev[i].date >= tk && FEATURE_RE.test(ev[i].name)) { feat = ev[i]; break; }

    if (feat) {
      var fd = parseYmd(feat.date);
      $('dday').innerHTML = '<div class="dday"><div class="dn">' + dLabel(diffDays(t, fd)) + '</div>' +
        '<div class="dt">' + esc(feat.name) + '<small>' + md(fd) + '</small></div></div>';
    } else {
      $('dday').innerHTML = '';
    }

    // 목록: NEIS 일정 + 시트 D-day, 같은 이름은 첫 날짜만
    var all = ev.concat(dd), seen = {}, list = [];
    all.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    for (i = 0; i < all.length && list.length < (feat ? 2 : 4); i++) {
      var e = all[i];
      if (e.date < tk || seen[e.name]) continue;
      if (feat && e.name === feat.name) { seen[e.name] = 1; continue; }
      seen[e.name] = 1; list.push(e);
    }
    var h = '';
    for (i = 0; i < list.length; i++) {
      var d = parseYmd(list[i].date), n = diffDays(t, d);
      h += '<li><span class="d">' + mdShort(d) + '</span><span class="n">' + esc(list[i].name) + '</span><span class="r">' + (n === 0 ? '오늘' : dLabel(n)) + '</span></li>';
    }
    if (!h) h = '<li><span class="n" style="color:#8fa0bb">' + (STATE.events ? '예정된 일정이 없습니다' : '일정을 불러오는 중입니다') + '</span></li>';
    $('schedList').innerHTML = h;
  }

  function renderUpdated() {
    if (!STATE.updated) return;
    $('updated').innerHTML = '최근 갱신 ' + pad(STATE.updated.getHours()) + ':' + pad(STATE.updated.getMinutes()) +
      ' · 급식·학사일정 NEIS · 날씨 Open-Meteo';
  }

  function renderAll() {
    renderDate(); renderWeather(); renderMeals(); renderNotice(); renderSchedule(); renderUpdated();
  }

  /* ───────────── 갱신 ───────────── */
  function refresh() {
    if (DEMO) { demo(); renderAll(); return; }
    var pending = 5;
    function one() { if (--pending === 0) { STATE.updated = new Date(); renderAll(); } else { renderAll(); } }
    loadMeals(one); loadSchedule(one); loadNotices(one); loadDdays(one); loadWeather(one);
  }

  /* ───────────── 시계 · 화면 맞춤 ───────────── */
  var lastDay = '';
  function tick() {
    var d = new Date();
    $('hm').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('sec').innerHTML = pad(d.getSeconds());
    var k = ymd(d);
    if (k !== lastDay) { lastDay = k; renderAll(); if (STATE.updated) refresh(); }
  }

  var shiftStep = 0;
  var SHIFT = [[0, 0], [3, 0], [3, 3], [0, 3], [-3, 3], [-3, 0], [-3, -3], [0, -3], [3, -3]];
  function layout() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    var s = Math.min(w / 1920, h / 1080);
    var o = SHIFT[shiftStep % SHIFT.length];
    var x = (w - 1920 * s) / 2 + o[0] * s, y = (h - 1080 * s) / 2 + o[1] * s;
    var tr = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    var st = $('stage').style;
    st.webkitTransform = tr; st.transform = tr;
  }

  /* ───────────── 미리보기용 예시 데이터 (?demo=1) ───────────── */
  function demo() {
    var t = today0(), m = {}, i, d;
    var A = [['백미밥', '돼지고기김치찌개', '치즈닭갈비', '도토리묵무침', '배추김치', '요구르트'],
             ['흑미밥', '소고기미역국', '고등어구이', '감자채볶음', '깍두기', '청포도'],
             ['카레라이스', '팽이버섯된장국', '수제돈가스', '양배추샐러드', '배추김치', '초코우유'],
             ['차조밥', '어묵국', '제육볶음', '쌈채소&쌈장', '총각김치', '귤']];
    for (i = 0, d = 0; i < 10; i++) {
      var day = addDays(t, i);
      if (day.getDay() === 0 || day.getDay() === 6) continue;
      m[ymd(day)] = { '중식': { items: A[d % A.length], kcal: (780 + d * 23) + ' Kcal' } };
      d++;
    }
    STATE.meals = m;
    STATE.events = [
      { date: ymd(addDays(t, 3)), name: '학생회 정기회의' },
      { date: ymd(addDays(t, 9)), name: '진로체험의 날' },
      { date: ymd(addDays(t, 17)), name: '2학기 2회고사' },
      { date: ymd(addDays(t, 30)), name: '이우 축제' }
    ];
    STATE.ddays = [];
    STATE.notices = [
      { title: '2학기 2회고사 시간표 안내', body: '시험 시간표가 학급 게시판에 게시되었습니다.\n시험 기간에는 도서관이 저녁 8시까지 운영됩니다.', tag: '학사', hot: true },
      { title: '학생회 건의함 운영', body: '급식·시설·행사 관련 건의는 1층 학생회실 앞 건의함에 넣어 주세요.', tag: '학생회', hot: false },
      { title: '분실물 보관 안내', body: '교무실 옆 분실물 보관함에서 찾아가세요. 매월 말 정리합니다.', tag: '생활', hot: false }
    ];
    STATE.weather = { t: 14.2, feel: 13, code: 2, day: 1, max: 18, min: 8, pop: 10 };
    STATE.updated = new Date();
    setStatus('meal', true); setStatus('sched', true); setStatus('notice', true); setStatus('weather', true);
  }

  /* ───────────── 시작 ───────────── */
  $('schoolName').innerHTML = esc(CONFIG.schoolName);
  STATE.meals = load('meals'); STATE.events = load('events'); STATE.notices = load('notices');
  STATE.ddays = load('ddays'); STATE.weather = load('weather');
  layout();
  window.onresize = layout;
  tick();
  refresh();

  setInterval(tick, 1000);
  setInterval(refresh, CONFIG.refreshMinutes * 60000);
  setInterval(rotateNotice, CONFIG.noticeSeconds * 1000);
  setInterval(function () { shiftStep++; layout(); }, 5 * 60000);   // 잔상 방지용 미세 이동
  setInterval(function () {
    if (navigator.onLine !== false) location.reload();
  }, CONFIG.reloadHours * 3600000);
})();
</script>
</body>
</html>
